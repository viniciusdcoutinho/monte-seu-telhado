<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F8">
<title>Monte seu Telhado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de uma coluna, altura da tela; casa fixa no topo, conteúdo rola, botão fixo embaixo */
:root{
  --p:#0A4DA2; --pSoft:color-mix(in oklab,#0A4DA2 22%,transparent);
  --ink:#0F1E2E; --muted:#46556A; --ground:#F4F6F8; --line:#DAE1E8; --outer:#DDE3EA;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
#app{height:100%;display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:430px;height:100%;position:relative;overflow:hidden;background:var(--ground);display:flex;flex-direction:column}
@media (min-width:600px) and (min-height:700px){.app{height:min(844px,calc(100% - 40px));border-radius:36px;box-shadow:0 30px 80px rgba(15,30,46,.25),0 0 0 10px #10263F}}
.h1{font-family:var(--display);font-weight:700;font-size:27px;line-height:1.12;letter-spacing:-0.015em;margin:0;text-wrap:balance}
.sub{font-size:15px;line-height:1.45;color:var(--muted);margin:0;text-wrap:pretty}
.screen{display:flex;flex-direction:column;gap:18px;animation:rise .35s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 2px rgba(15,30,46,.1);flex-shrink:0}
.backbtn{width:36px;height:36px;border-radius:12px;position:relative}.backbtn::after{content:'';position:absolute;inset:-6px}
.seg{flex:1;height:6px;border-radius:3px;background:#D3DBE3;transition:background .3s}
.seg.done{background:var(--p)}
.seg.cur{background:linear-gradient(90deg,var(--p) 50%,#D3DBE3 50%)}
.stage{margin:0 -4px 20px;border-radius:24px;background:#CFE3F5;position:relative;overflow:hidden;flex-shrink:0;transition:height .35s}
.stage-in{position:absolute;left:50%;top:0;width:358px;transform-origin:top center}
.cta{width:100%;height:46px;border:0;border-radius:14px;background:var(--p);color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,opacity .2s;box-shadow:0 6px 16px var(--pSoft)}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.link{background:none;border:0;color:var(--p);font-weight:700;font-size:15px;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;align-self:center}
.opt{position:relative;border:2px solid var(--line);background:#fff;border-radius:22px;cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s;text-align:left;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:44px}
.opt:active{transform:scale(.97)}
.opt.on{border-color:var(--p);box-shadow:0 0 0 4px var(--pSoft)}
.chk{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:12px;background:var(--p);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.4);transition:all .2s}
.opt.on .chk{opacity:1;transform:scale(1)}
.ico{width:52px;height:52px;border-radius:16px;background:#EEF3F8;display:flex;align-items:center;justify-content:center;color:var(--p);transition:background .2s,color .2s}
.opt.on .ico{background:var(--p);color:#fff}
.otitle{font-weight:700;font-size:16px;line-height:1.2}
.odesc{font-size:13px;color:#56657A;line-height:1.35}
.field{width:100%;height:56px;border-radius:16px;border:2px solid #CFD8E1;background:#fff;font-size:20px;font-weight:600;padding:0 16px;letter-spacing:.04em;font-family:inherit;color:var(--ink)}
.field:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--pSoft)}
.ok{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:#E3F3EA;color:#155C39;font-size:14px;font-weight:600;animation:rise .3s both}
.chip{min-height:44px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:600;font-size:15px;cursor:pointer}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 30px 10px;margin:0 -20px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.gcard{flex:0 0 290px;scroll-snap-align:center;border-radius:26px;background:#10263F;color:#fff;padding:14px;display:flex;flex-direction:column;gap:12px;border:3px solid #2A4563;animation:deal .5s cubic-bezier(.2,.8,.2,1.2) both}
.gcard.ideal{border-color:#F29A3F;box-shadow:0 10px 28px rgba(242,154,63,.35)}
@keyframes deal{from{opacity:0;transform:translateY(30px) rotate(-4deg) scale(.9)}to{opacity:1;transform:none}}
.badge{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:8px;background:#2A4563;color:#fff}
.gcard.ideal .badge{background:#F29A3F;color:#1F1200}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:#F5A650;animation:grow .8s .2s ease-out both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dot{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.dot i{width:8px;height:8px;border-radius:4px;background:#B9C4CF;transition:all .25s}
.dot.on i{width:22px;background:var(--p)}
.sw{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0;font-size:14px;font-weight:600;min-height:44px}
.sw .ring{width:68px;height:68px;border-radius:34px;padding:5px;border:3px solid transparent;transition:border-color .2s,transform .2s;display:block}
.sw.on .ring{border-color:var(--p);transform:scale(1.06)}
.sw .fill{display:block;width:100%;height:100%;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.12)}
.tip{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:16px;background:#FFF3E3;color:#6B3A00;font-size:14px;line-height:1.4;animation:rise .3s both}
.seal{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.04em;padding:4px 10px;border-radius:8px;background:#FFE1BF;color:#7A3D00;text-transform:uppercase}
.extra{font-weight:800;font-size:15px;white-space:nowrap;text-align:right}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.shape.wide{grid-column:span 2;flex-direction:row;align-items:center}
.stepper{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px;border:2px solid var(--line)}
.stepper .mid{flex-grow:1;text-align:center;display:flex;flex-direction:column}
.stepper .lbl{font-size:13px;font-weight:700;color:#56657A}
.sbtn{width:52px;height:52px;border-radius:16px;border:0;background:#EEF3F8;color:var(--p);font-size:26px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s;touch-action:manipulation}
.sbtn:active{transform:scale(.92);background:var(--pSoft)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slope{border:2px solid var(--line);background:#fff;border-radius:16px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:700;cursor:pointer;color:#34435A}
.slope.on{border-color:var(--p);color:var(--p);box-shadow:0 0 0 3px var(--pSoft)}
.result{border-radius:22px;background:#10263F;color:#fff;padding:18px;display:flex;flex-direction:column;gap:4px}
.big{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tag{position:absolute;min-height:44px;padding:0 12px;font-size:13px!important;border-radius:22px;border:2px solid var(--tc,var(--p));background:#fff;color:var(--tc,var(--p));font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 4px 10px rgba(15,30,46,.15);transition:background .2s,color .2s}
.tag.on{background:var(--tc,var(--p));color:#fff}
/* Medidas: duas medidas sempre visíveis, cada uma com sua cor */
.stepper.dim{border-left:6px solid var(--dc);transition:border-color .2s,box-shadow .2s}
.stepper.dim.act{border-color:var(--dc);box-shadow:0 0 0 3px color-mix(in oklab,var(--dc) 22%,transparent)}
.dim .sbtn{color:var(--dc)}
.ddot{display:inline-block;width:10px;height:10px;border-radius:5px;background:var(--dc);margin-right:6px}
.numin{width:100%;border:0;background:transparent;text-align:center;font-family:var(--display);font-size:28px;font-weight:800;color:var(--ink);padding:2px 0;font-variant-numeric:tabular-nums;border-radius:10px}
.numin:focus{outline:none;background:#EEF3F8}
.hint{font-size:12px;color:#56657A;line-height:1.3}
/* Etapa PIR */
.pcard{border-radius:24px;background:#fff;border:2px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;animation:rise .35s both}
.prow{display:flex;gap:12px;align-items:flex-start}
.prow .pi{width:40px;height:40px;border-radius:12px;background:#EEF3F8;color:var(--p);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prow b{display:block;font-size:15px;line-height:1.25}
.prow span{font-size:13px;color:#56657A;line-height:1.35}
.cbar{display:grid;grid-template-columns:96px minmax(0,1fr) 62px;gap:8px;align-items:center;font-size:13px;font-weight:600}
.cbar .tr{height:14px;border-radius:7px;background:#EEF3F8;overflow:hidden}
.cbar .tr i{display:block;height:100%;border-radius:7px;animation:grow .8s .15s ease-out both;transform-origin:left}
.src{font-size:11px;color:#7A8899;line-height:1.3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--pSoft)}50%{box-shadow:0 0 0 8px transparent}}
.kitrow{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:18px;background:#fff;border:2px solid var(--line);cursor:pointer;transition:all .2s;position:relative}
.kitrow.on{border-color:#BFD2E6}
.kitrow.off{background:#F7F8FA;border-style:dashed}
.kitrow.off .otitle,.kitrow.off .odesc{opacity:.6}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.box{width:28px;height:28px;border-radius:9px;border:2px solid #B5C1CD;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;color:transparent}
.kitrow.on .box{background:var(--p);border-color:var(--p);color:#fff}
.kitrow:focus-within{box-shadow:0 0 0 4px var(--pSoft)}
.warn{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:#FFF3E3;color:#6B3A00;font-size:14px;line-height:1.4;animation:rise .25s both}
.complete{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#E3F3EA;color:#155C39;font-weight:800;animation:pop .45s both}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.sum{background:#fff;border-radius:22px;border:2px solid var(--line);overflow:hidden}
.sumhead{width:100%;min-height:56px;border:0;background:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:16px;font-weight:700;cursor:pointer}
.chev{transition:transform .25s}
.chev.open{transform:rotate(180deg)}
.line{display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:1.35;font-variant-numeric:tabular-nums}
.muted{color:#56657A}
.line>:last-child{white-space:nowrap}
.result .big{font-size:26px}
.sec{min-height:48px;border-radius:16px;border:2px solid #CBD5DF;background:#fff;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;flex:1;padding:0 8px}
.fade{transition:opacity .45s}
.roof{transition:fill .5s}
.houseB{transform-box:fill-box;transform-origin:center}
.houseB.pop{animation:pop .6s both}
.conf{position:absolute;top:-20px;width:9px;height:15px;border-radius:2px;animation:fall 2.8s ease-in both;pointer-events:none}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(900px) rotate(620deg);opacity:.3}}
.toast{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;border-radius:14px;background:#E3F3EA;color:#155C39;font-weight:700;animation:pop .4s both}
.ctabar{position:absolute;left:0;right:0;bottom:0;padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--ground);box-shadow:0 -8px 24px rgba(15,30,46,.08)}
.scroll{flex-grow:1;min-height:0;overflow-y:auto;padding:4px 20px 106px;-webkit-overflow-scrolling:touch}
button:focus-visible,input:focus-visible{outline:3px solid var(--p);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ico2{width:64px;height:64px;border-radius:18px;background:#EEF3F8;display:flex;align-items:center;justify-content:center}
.note{font-size:14px;color:#46556A;background:#EEF3F8;border-radius:14px;padding:12px 14px;line-height:1.4}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<style>
/* ===================== Estúdio 3D (montagem em 3D a partir da etapa Formato) ===================== */
.es-h2{font-family:'Bricolage Grotesque','Figtree',sans-serif;font-weight:700;font-size:22px;line-height:1.15;letter-spacing:-.01em;margin:0;text-wrap:balance}
.es-sub{font-size:14px;line-height:1.45;color:#46556A;margin:0;text-wrap:pretty}

.es-iconbtn{width:36px;height:36px;border-radius:12px;border:0;background:#fff;color:#10263F;text-decoration:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 2px rgba(15,30,46,.1);flex-shrink:0;position:relative}
.es-iconbtn::after{content:'';position:absolute;inset:-6px}

.es-statp{position:absolute;left:10px;top:10px;padding:8px 12px;border-radius:14px;font-size:12px;font-weight:800;color:#10263F;max-width:260px;line-height:1.3}
.es-camb{width:58px;min-height:52px;border-radius:16px;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;color:#34435A;cursor:pointer;box-shadow:0 4px 14px rgba(15,30,46,.16);padding:4px 0}
.es-camb.es-on{background:#10263F;color:#fff;border-color:#10263F}
.es-tabs{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:2px;padding:3px;border-radius:15px}
.es-tab{min-height:34px;padding:0 12px;border:0;border-radius:12px;background:transparent;font-weight:800;font-size:13px;color:#34435A;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.es-tab.es-on{background:#10263F;color:#fff}
.es-vphint{position:absolute;left:10px;top:52px;max-width:250px;padding:6px 10px;border-radius:10px;font-size:11px;font-weight:700;color:#10263F;line-height:1.35}
.es-vpmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:800;color:#10263F;background:linear-gradient(#9CC3EA,#E3EDF5);text-align:center;padding:0 40px}
.es-spin{width:36px;height:36px;border-radius:50%;border:4px solid rgba(16,38,63,.15);border-top-color:#10263F;animation:es-sp .9s linear infinite}
@keyframes es-sp{to{transform:rotate(360deg)}}
.es-panel{flex-grow:1;min-height:0;overflow-y:auto;padding:18px 20px 84px;background:#F4F6F8;border-radius:22px 22px 0 0;margin-top:-14px;position:relative;z-index:2;box-shadow:0 -10px 24px rgba(15,30,46,.10)}
.es-sect{display:flex;flex-direction:column;gap:10px}
.es-hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:3px 20px 5px}
.es-hscroll::-webkit-scrollbar{display:none}
.es-tplb{flex:0 0 auto;min-width:92px;min-height:82px;border:2px solid #DAE1E8;background:#fff;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:800;color:#34435A;cursor:pointer;padding:6px 10px}
.es-tplb.es-on{border-color:var(--p);color:var(--p);box-shadow:0 0 0 3px var(--pSoft)}
.es-fmb{flex:0 0 auto;width:96px;min-height:84px;border:2px solid #DAE1E8;background:#fff;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:800;color:#56657A;cursor:pointer;padding:6px 4px;text-align:center;line-height:1.15}
.es-fmb.es-on{border-color:var(--p);color:var(--p);box-shadow:0 0 0 3px var(--pSoft)}
.es-chip2{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:14px;border:2px solid #DAE1E8;background:#fff;font-weight:800;font-size:13px;color:#34435A;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.es-chip2.es-on{border-color:var(--p);color:var(--p);box-shadow:0 0 0 3px var(--pSoft)}
.es-chip2.es-add{border-style:dashed;color:var(--p)}
.es-chip2:disabled{opacity:.4;cursor:not-allowed}
.es-card{background:#fff;border:2px solid #DAE1E8;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:14px}
.es-blkbadge{width:40px;height:40px;border-radius:12px;background:var(--p);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.es-minibtn{min-height:44px;padding:0 12px;border-radius:14px;border:2px solid #DAE1E8;background:#fff;font-weight:700;font-size:13px;color:#34435A;cursor:pointer;display:flex;align-items:center;gap:6px}
.es-minibtn:disabled{opacity:.4;cursor:not-allowed}
.es-mstp{border:2px solid #DAE1E8;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center}
.es-mstp .es-l{font-size:12px;font-weight:700;color:#56657A}
.es-mrow{display:flex;align-items:center;gap:6px;width:100%;justify-content:space-between}
.es-mval{font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.es-sbtn{width:44px;height:44px;border-radius:14px;border:0;background:#EEF3F8;color:var(--p);font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.es-fbtn{border:2px solid #DAE1E8;background:#fff;border-radius:14px;min-height:58px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:#34435A;cursor:pointer}
.es-fbtn.es-on{border-color:var(--p);color:var(--p);box-shadow:0 0 0 3px var(--pSoft)}
.es-swb{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#34435A;min-height:44px;padding:2px 0}
.es-swb .es-ring{width:48px;height:48px;border-radius:24px;padding:4px;border:3px solid transparent;display:block;transition:border-color .2s}
.es-swb.es-on .es-ring{border-color:var(--p)}
.es-swb .es-fill{display:block;width:100%;height:100%;border-radius:50%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),0 2px 4px rgba(0,0,0,.14)}
.es-res{border-radius:20px;background:#10263F;color:#fff;padding:16px;display:flex;flex-direction:column;gap:4px}
.es-big{font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:28px;font-weight:800;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.es-bomrow{width:100%;display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:2px solid #DAE1E8;background:#fff;text-align:left;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.es-bomrow.es-on{border-color:var(--p);box-shadow:0 0 0 3px var(--pSoft)}
.es-bomdot{width:16px;height:16px;border-radius:5px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.es-tag2{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;background:#FFE9CC;color:#7A3D00;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.es-qty{font-weight:800;font-size:14px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.es-ghost{width:100%;min-height:52px;border-radius:16px;border:2px solid #CBD5DF;background:#fff;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:#10263F}
.es-ghost.es-on{border-color:var(--p);color:var(--p)}
.es-tog{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:58px;padding:10px 14px;border-radius:16px;border:2px solid #DAE1E8;background:#fff;cursor:pointer;text-align:left}
.es-tog .es-knob{width:46px;height:28px;border-radius:14px;background:#C9D2DB;position:relative;flex-shrink:0;transition:background .2s}
.es-tog .es-knob i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.es-tog.es-on{border-color:var(--p)}
.es-tog.es-on .es-knob{background:var(--p)}
.es-tog.es-on .es-knob i{transform:translateX(18px)}
.es-rng{width:100%;-webkit-appearance:none;appearance:none;height:44px;background:transparent;cursor:pointer;margin:0}
.es-rng::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,#2F5E8C,#F6B73C 30%,#F29A3F 50%,#F6B73C 70%,#2F5E8C)}
.es-rng::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:15px;background:#fff;border:4px solid #F29A3F;margin-top:-10px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.es-rng::-moz-range-track{height:10px;border-radius:5px;background:#F6B73C}
.es-rng::-moz-range-thumb{width:24px;height:24px;border-radius:12px;background:#fff;border:4px solid #F29A3F}
.es-hbar{height:12px;border-radius:6px;background:#EEF3F8;overflow:hidden}
.es-hbar i{display:block;height:100%;border-radius:6px;transition:width .3s}
.es-hrow{display:flex;flex-direction:column;gap:6px}
.es-hrow .es-t{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700}
.es-note{font-size:13px;color:#46556A;background:#EEF3F8;border-radius:14px;padding:12px 14px;line-height:1.45}
.es-ctabar{position:absolute;left:0;right:0;bottom:0;padding:8px 16px 14px;background:#F4F6F8;box-shadow:0 -8px 24px rgba(15,30,46,.08);z-index:4}
.es-cta{width:100%;height:46px;border:0;border-radius:14px;background:var(--p);color:#fff;text-decoration:none;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 16px var(--pSoft)}
.es-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.es-grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.es-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.es-grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.es-cta:hover{color:#fff}
/* Estúdio no app: área do 3D acompanha a altura da tela; botão respeita a borda do celular */
.es-vp{position:relative;flex-shrink:0;height:clamp(300px,52%,450px);background:linear-gradient(#8FB9E4,#E3EDF5);overflow:hidden}
.es-ctabar{padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.es-panel{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.es-rng{touch-action:pan-y}
/* Etapa Formato: selo 3D nos cards */
.b3d{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:10px;background:#EEF3F8;color:var(--p);font-size:11px;font-weight:800;letter-spacing:.03em}
</style>
</head>
<body>
<div id="app"></div>
<script>
class DCLogic {
  constructor() { this.props = {}; this.state = {}; }
  setState(p) { this.state = Object.assign({}, this.state, p); scheduleRender(); }
}
class Component extends DCLogic {
  st(k, blank, demo) {
    const s = this.state || {};
    if (s[k] !== undefined) return s[k];
    return Number(this.props.startStep || 0) > 0 ? demo : blank;
  }
  renderVals() {
    const self = this;
    const s = this.state || {};
    const start = Number(this.props.startStep || 0);
    const step = s.step !== undefined ? s.step : start;
    const accent = this.props.accent || '#0A4DA2';
    const set = (p) => self.setState(p);
    const go = (n) => set({ step: n, alertKey: null });
    const f1 = (n) => n.toFixed(1);
    const nf = (n, d) => n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
    const money = (n) => 'R$ ' + nf(n, 2);

    // ---------- CEP e fábrica ----------
    const cep = this.st('cep', '', '75132-000');
    const digits = cep.replace(/\D/g, '');
    const cepOk = digits.length === 8;
    const p2 = parseInt(digits.slice(0, 2) || '0', 10);
    let fab = 'Anápolis (GO)', dias = 4;
    if (p2 >= 78 && p2 <= 79) { fab = 'Várzea Grande (MT)'; dias = 5; }
    else if (p2 >= 80) { fab = 'Araquari (SC)'; dias = 5; }
    else if (p2 >= 66 && p2 <= 69) { fab = 'Várzea Grande (MT)'; dias = 12; }
    else if (p2 >= 50 && p2 <= 56) { fab = 'Vitória de Santo Antão (PE)'; dias = 5; }
    else if (p2 >= 40 && p2 <= 65) { fab = 'Vitória de Santo Antão (PE)'; dias = 8; }
    else if (p2 >= 20 && p2 <= 39) { fab = 'Cambuí (MG)'; dias = 5; }
    else if (p2 >= 1 && p2 <= 19) { fab = 'Cambuí (MG)'; dias = 4; }
    const onCep = (e) => {
      const d = String(e.target.value).replace(/\D/g, '').slice(0, 8);
      set({ cep: d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d });
    };

    // ---------- Telhas ----------
    const TELHAS = [
      { id: 'trap', img: 'https://t56141.vtexassets.com/arquivos/ids/162027-1200-auto?v=638824150350300000&width=1200&height=auto&aspect=true', nome: 'Telha Térmica Trapezoidal', curto: 'Trapezoidal', desc: 'Resistente e versátil, vai bem em quase todo telhado.', termico: 4, vedacao: 5, preco: 4, base: 119, ribs: 2.2, profile: 'M0 60 H18 L30 30 H52 L64 60 H84 L96 30 H118 L130 60 H150 L162 30 H184 L196 60 H216 L228 30 H250 L262 60' },
      { id: 'colonial', img: 'https://t56141.vtexassets.com/arquivos/ids/165766-1200-auto?v=639217235976000000&width=1200&height=auto&aspect=true', nome: 'Telha Térmica Colonial', curto: 'Colonial', desc: 'Visual de telha de barro, sem o peso.', termico: 4, vedacao: 5, preco: 3, base: 149, ribs: 3.6, profile: 'M0 55 Q16 20 32 55 Q48 20 64 55 Q80 20 96 55 Q112 20 128 55 Q144 20 160 55 Q176 20 192 55 Q208 20 224 55 Q240 20 262 55' },
      { id: 'ond', img: 'https://t56141.vtexassets.com/arquivos/ids/157344-1200-auto?v=638364229269630000&width=1200&height=auto&aspect=true', nome: 'Telha Residence', curto: 'Residence', desc: 'Linha pensada para telhados de casas.', termico: 3, vedacao: 4, preco: 5, base: 99, ribs: 4.6, profile: 'M0 45 C10 30 20 30 30 45 S50 60 60 45 S80 30 90 45 S110 60 120 45 S140 30 150 45 S170 60 180 45 S200 30 210 45 S230 60 240 45 S256 34 262 40' }
    ];
    const area = this.st('area', null, 'casa');
    const btype = area || 'casa';
    const prios = this.st('prios', [], ['fresca', 'goteira']);
    const revealed = s.revealed !== undefined ? s.revealed : Number(this.props.startReveal || 0) > 0;
    const has = (k) => prios.indexOf(k) >= 0;
    const score = (t) => (has('fresca') ? t.termico : 0) + (has('goteira') ? t.vedacao : 0) + (has('preco') ? t.preco * 1.3 : 0) + (has('colonial') && t.id === 'colonial' ? 10 : 0) + (t.id === 'trap' ? 0.5 : 0);
    const ordered = TELHAS.slice().sort((a, b) => score(b) - score(a));
    const cardIdx = s.cardIdx || 0;
    const telhaId = s.telha || (start > 0 ? 'trap' : ordered[0].id);
    const telha = TELHAS.find((t) => t.id === telhaId) || TELHAS[0];

    const COLORS = [
      { id: 'branco', nome: 'Branco', hex: '#EEF1F3' },
      { id: 'cinza', nome: 'Cinza claro', hex: '#AEB7C0' },
      { id: 'grafite', nome: 'Grafite', hex: '#454D57' },
      { id: 'terracota', nome: 'Terracota', hex: '#B5523B' },
      { id: 'azul', nome: 'Azul', hex: '#2F5E8C' },
      { id: 'verde', nome: 'Verde', hex: '#4F7A5A' }
    ];
    const colorId = s.color || (telha.id === 'colonial' ? 'terracota' : 'grafite');
    const color = COLORS.find((c) => c.id === colorId) || COLORS[2];
    const roofHex = step >= 5 ? color.hex : '#9AA5B1';
    const shadeHex = (hex, k) => { const n = parseInt(hex.slice(1), 16); const r = Math.round(((n >> 16) & 255) * k), g = Math.round(((n >> 8) & 255) * k), b = Math.round((n & 255) * k); return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); };
    const roofDark = shadeHex(roofHex, 0.8);

    // Trapezoidal: 20/30/50 mm. Colonial: só existe em 40 mm (catálogo VTEX e ficha técnica, 07/10/2026)
    const isColonial = telha.id === 'colonial';
    const COMF = isColonial ? [
      { id: 'col', nome: 'Conforto', mm: '40 mm', desc: 'A telha colonial é fabricada com 40 mm de PIR. Boa para casas: quartos, salas e cozinha.', extraV: 0, level: 0.75, rec: true }
    ] : [
      { id: 'bom', nome: 'Essencial', mm: '20 mm', desc: 'Para garagens, varandas e áreas abertas.', extraV: -12, level: 0.35 },
      { id: 'melhor', nome: 'Conforto', mm: '30 mm', desc: 'Ideal para quartos, salas e cozinha.', extraV: 0, level: 0.68, rec: true },
      { id: 'max', nome: 'Máximo', mm: '50 mm', desc: 'Para regiões muito quentes, quartos sob o telhado ou ar-condicionado.', extraV: 22, level: 1 }
    ];
    const comfortId = isColonial ? 'col' : (s.comfort && s.comfort !== 'col' ? s.comfort : 'melhor');
    const comfort = COMF.find((c) => c.id === comfortId);
    const tk = step >= 6 ? ({ bom: 2, melhor: 3, max: 5, col: 4 })[comfortId] : 3;

    // ---------- Formato e medidas ----------
    const isCasa = btype === 'casa';
    const shape = this.st('shape', null, '2');
    const SH = shape || (btype === 'gourmet' ? '1' : '2');
    const hs = ['1', '2', 'chale', 'plat', 'varanda'].indexOf(SH) >= 0 ? SH : (SH === 'outro' ? 'plat' : '2');
    const DIMS = { casa: [7, 9], gourmet: [6, 4], galpao: [20, 12], comercio: [12, 8] };
    const dims = DIMS[btype];
    const w = s.w !== undefined ? s.w : dims[0];
    const l = s.l !== undefined ? s.l : dims[1];
    const GW = l, GL = w;
    const SLOPES = [
      { id: 'reto', nome: 'Quase reto', v: 0.10, k: 5 },
      { id: 'medio', nome: 'Médio', v: 0.15, k: 10 },
      { id: 'inclinado', nome: 'Bem inclinado', v: 0.25, k: 18 }
    ];
    const slopeId = s.slope || 'medio';
    const sv = hs === 'chale' ? 1.0 : SLOPES.find((x) => x.id === slopeId).v;
    const focus = s.focus || 'w';
    const knowSize = !!s.knowSize;
    const kLen = s.kLen !== undefined ? s.kLen : 5.2;
    const kQty = s.kQty !== undefined ? s.kQty : 14;
    const vdep = Math.max(1.2, Math.min(2, GW / 4, GL / 4));
    const coreW = GW - 2 * vdep, coreL = GL - 2 * vdep;

    // ---------- Fixação ----------
    const fix = this.st('fix', null, 'madeira');

    // ---------- Cálculo das telhas (largura útil 1,00 m) ----------
    const cosA = 1 / Math.sqrt(1 + sv * sv);
    const up10 = (x) => Math.ceil(x * 10 - 1e-6) / 10;
    let pieces;
    const studioOk = !!s.studioPieces && s.studioKey === JSON.stringify([SH, w, l, slopeId]);
    if (knowSize) pieces = [{ qty: kQty, len: kLen }];
    else if (studioOk) pieces = s.studioPieces.map((p) => ({ qty: p.qty, len: p.len }));
    else if (hs === '1') pieces = [{ qty: Math.ceil(GL - 1e-6), len: up10((GW + 0.6) / cosA) }];
    else if (hs === 'plat') pieces = [{ qty: Math.ceil(GL - 1e-6) * 2, len: up10((GW / 2 + 0.1) / cosA) }];
    else if (hs === 'varanda') {
      const len1 = up10((coreW / 2 + 0.3) / cosA), len2 = up10((vdep + 0.3) / cosA);
      pieces = [{ qty: Math.ceil(coreW * coreL / cosA / len1), len: len1 }, { qty: Math.ceil((GW * GL - coreW * coreL) / cosA / len2), len: len2 }];
    }
    else pieces = [{ qty: Math.ceil(GL - 1e-6) * 2, len: up10((GW / 2 + 0.6) / cosA) }];
    const tQty = pieces.reduce((a, p) => a + p.qty, 0);
    const areaM2 = pieces.reduce((a, p) => a + p.qty * p.len, 0);
    const tLen = Math.max.apply(null, pieces.map((p) => p.len));
    const aguas = hs === '1' ? 1 : 2;
    const resultTxt = pieces.map((p, i) => (i ? p.qty + ' de ' : p.qty + ' telhas de ') + nf(p.len, 2) + ' m').join(' + ');

    // ---------- Kit ----------
    const kit = s.kit || { cumeeira: true, rufos: true, parafusos: true, vedacao: true };
    const alertKey = s.alertKey || null;
    let top;
    if (hs === 'plat') top = { nome: 'Calha central', desc: 'Recebe a água das duas águas no meio do telhado', qty: Math.ceil(GL / 3), un: 'peças de 3 m', unit: 129, alert: 'Sem a calha, a chuva não tem por onde sair.' };
    else if (hs === '1') top = { nome: 'Rufo de topo', desc: 'Fecha o lado mais alto do telhado', qty: Math.ceil(GL), un: 'peças', unit: 89, alert: 'Sem ele, a chuva pode entrar pelo lado mais alto. Tem certeza?' };
    else if (hs === 'varanda') top = { nome: 'Cumeeira e espigões', desc: 'Fecham o topo e as quinas do telhado', qty: Math.ceil(Math.max(0, coreL - coreW) + 4 * (coreW / 2) * 1.5), un: 'peças', unit: 89, alert: 'Sem elas, a chuva pode entrar pelo topo e pelas quinas.' };
    else top = { nome: 'Cumeeira', desc: 'Fecha o encontro das duas águas lá no alto', qty: Math.ceil(GL), un: 'peças', unit: 89, alert: 'Sem ela, a chuva pode entrar pelo topo do telhado. Tem certeza?' };
    let rufo;
    if (hs === 'plat') rufo = { nome: 'Rufos de platibanda', desc: 'Vedam o encontro do telhado com a mureta', qty: Math.ceil(2 * (GW + GL) / 3), un: 'peças de 3 m', unit: 64, alert: 'Sem rufos, a água pode infiltrar na mureta.' };
    else if (hs === 'varanda') rufo = { nome: 'Rufos de encontro', desc: 'Vedam o encontro da varanda com a parede', qty: Math.ceil(2 * (coreW + coreL) / 3), un: 'peças de 3 m', unit: 64, alert: 'Sem rufos, a água pode escorrer pela parede.' };
    else rufo = { nome: 'Rufos laterais', desc: 'Acabamento das bordas, protege as paredes', qty: Math.ceil((tLen * aguas * 2) / 3), un: 'peças de 3 m', unit: 64, alert: 'Sem rufos, a água pode escorrer pela parede e manchar.' };
    const FIXN = { madeira: 'Parafusos para madeira', metalon: 'Parafusos autobrocantes para metalon', lsf: 'Parafusos autobrocantes para LSF', naosei: 'Parafusos (modelo a confirmar)' };
    const FIXD = { madeira: 'Rosca para madeira, com arruela de vedação', metalon: 'Furam o aço sozinhos, com arruela de vedação', lsf: 'Próprios para perfis de aço leve', naosei: 'Um especialista confirma o modelo com você' };
    const fk = fix || 'naosei';
    const KIT = [
      Object.assign({ id: 'cumeeira' }, top),
      Object.assign({ id: 'rufos' }, rufo),
      { id: 'parafusos', nome: FIXN[fk], desc: FIXD[fk], qty: Math.ceil((areaM2 * 3) / 50) * 50, un: 'unidades', unit: 0.85, alert: 'As telhas precisam de parafusos próprios. Se você já tem, tudo bem!' },
      { id: 'vedacao', nome: 'Fita de vedação', desc: 'Evita goteiras nas emendas', qty: Math.max(1, Math.ceil(tQty / 6)), un: 'rolos', unit: 49, alert: 'Sem vedação, podem aparecer goteiras nas emendas.' }
    ];
    const kitItems = KIT.map((k) => ({
      nome: k.nome, desc: k.desc, alert: k.alert, on: !!kit[k.id],
      cls: kit[k.id] ? 'kitrow on' : 'kitrow off',
      qtyTxt: k.qty + ' ' + k.un,
      price: money(k.qty * k.unit),
      total: kit[k.id] ? k.qty * k.unit : 0,
      showAlert: alertKey === k.id && !kit[k.id],
      toggle: () => { const nk = Object.assign({}, kit); nk[k.id] = !kit[k.id]; set({ kit: nk, alertKey: kit[k.id] ? k.id : null }); }
    }));
    const kitComplete = kitItems.every((k) => k.on);
    const acess = kitItems.reduce((a, k) => a + k.total, 0);
    const precoM2 = telha.base + comfort.extraV;
    const telhasV = areaM2 * precoM2;
    const frete = 290 + dias * 25;
    const total = telhasV + acess + frete;

    // ---------- Casa 3D (isométrica) ----------
    // eixo x = comprimento (sentido da caída da telha), eixo y = largura (sentido da cumeeira); z em metros
    const stageH = step === 3 ? 230 : 200;
    const EX = sv < 0.5 ? 1.7 : 1.0;
    const rz = (dist) => dist * sv * EX;
    const isOpen = btype === 'gourmet';
    let WH = ({ casa: 2.8, gourmet: 2.6, galpao: 5, comercio: 3.5 })[btype];
    if (hs === 'chale') WH = 1.0;
    let zTop;
    if (hs === '1') zTop = WH + rz(GW);
    else if (hs === 'plat') zTop = WH + rz(GW / 2) + 0.5;
    else if (hs === 'varanda') zTop = 2.5 + rz(vdep) + 0.5 + rz(coreW / 2);
    else zTop = WH + rz(GW / 2);
    zTop = Math.max(zTop, 3.4);
    const mg = 2.4, span = GW + GL + 4 * mg;
    const sc = Math.min(11, 330 / (span * 0.866), (stageH - 46) / (span * 0.5 + zTop * 1.45));
    const hk = sc * 1.45;
    const X0 = 179 - (GL - GW) * 0.866 * sc / 2;
    const Y0 = stageH - 20 - mg * sc;
    const P = (x, y, z) => ({ x: X0 + (y - x) * 0.866 * sc, y: Y0 - (x + y) * 0.5 * sc - (z || 0) * hk });
    const Pz = (p, dz) => P(p[0], p[1], p[2] + (dz || 0));
    const poly = (pts) => 'M' + pts.map((p) => f1(p.x) + ' ' + f1(p.y)).join(' L') + ' Z ';
    const line = (a, b) => 'M' + f1(a.x) + ' ' + f1(a.y) + ' L' + f1(b.x) + ' ' + f1(b.y) + ' ';
    const circ = (p, r) => 'M' + f1(p.x - r) + ' ' + f1(p.y) + ' a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0 a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0 ';
    const L3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
    const items = [];
    const add = (d, o) => { if (d) items.push(Object.assign({ d: d, f: 'none', s: 'none', w: 0, o: 1, da: '', c: '' }, o || {})); };
    const K = '#0F1E2E', WALL = '#F7EFE4', WALL2 = '#E7D8C2';
    const acc = step >= 8;
    const fixView = step === 7;
    const roofO = fixView ? 0.25 : 1;
    const FIXC = { madeira: '#8B5A2B', metalon: '#5F6B78', lsf: '#9AA7B4', naosei: '#7B8794' };
    const tkm = tk / hk;
    const faceX = (x, y0, y1, z0, z1) => poly([P(x, y0, z0), P(x, y1, z0), P(x, y1, z1), P(x, y0, z1)]);
    const faceY = (y, x0, x1, z0, z1) => poly([P(x0, y, z0), P(x1, y, z0), P(x1, y, z1), P(x0, y, z1)]);

    // terreno
    const dn = (p) => ({ x: p.x, y: p.y + 10 });
    const g00 = P(-mg, -mg), gw0 = P(GW + mg, -mg), g0l = P(-mg, GL + mg), gwl = P(GW + mg, GL + mg);
    add(poly([g00, gw0, dn(gw0), dn(g00)]), { f: '#4F853A' });
    add(poly([g00, g0l, dn(g0l), dn(g00)]), { f: '#5E9A45' });
    add(poly([g00, gw0, gwl, g0l]), { f: '#8CC56B' });
    let grass = '';
    for (let i = 1; i < 6; i++) { const t = i / 6; grass += line(P(-mg + t * (GW + 2 * mg), -mg), P(-mg + t * (GW + 2 * mg) - 0.8, -mg + 0.5)); }
    add(grass, { s: '#7AB35A', w: 1.2 });
    const tree = (x, y) => { const b = P(x, y, 0), th = 1.1 * hk, r = 0.85 * sc; return { t: 'M' + f1(b.x - 1.8) + ' ' + f1(b.y) + ' h3.6 v' + f1(-th) + ' h-3.6 Z ', c: circ({ x: b.x, y: b.y - th - r * 0.55 }, +f1(r)) + circ({ x: b.x - r * 0.6, y: b.y - th }, +f1(r * 0.72)) + circ({ x: b.x + r * 0.6, y: b.y - th - r * 0.1 }, +f1(r * 0.72)) }; };
    const tb = [tree(GW + 1.5, GL * 0.5), tree(GW * 0.3, GL + 1.4)];
    add(tb.map((t) => t.t).join(''), { f: '#8A5A3C' });
    add(tb.map((t) => t.c).join(''), { f: '#4E8F3A', s: '#3B7129', w: 1 });

    // telhado: plano com bordas E0-E1 (beiral) e T0-T1 (topo)
    const plane = (E0, E1, T0, T1, dark, noBand) => {
      const bil = (u, v) => L3(L3(E0, E1, v), L3(T0, T1, v), u);
      if (!noBand) add(poly([Pz(E0), Pz(E1), Pz(E1, tkm), Pz(E0, tkm)]) + poly([Pz(E0), Pz(T0), Pz(T0, tkm), Pz(E0, tkm)]) + poly([Pz(E1), Pz(T1), Pz(T1, tkm), Pz(E1, tkm)]), { f: '#F2D48A', s: K, w: 1.1, o: roofO, c: 'fade' });
      add(poly([Pz(E0, tkm), Pz(E1, tkm), Pz(T1, tkm), Pz(T0, tkm)]), { f: dark ? roofDark : roofHex, s: K, w: 1.6, o: roofO, c: 'roof' });
      const lenV = Math.hypot(E1[0] - E0[0], E1[1] - E0[1]);
      const n = Math.max(3, Math.round(lenV * telha.ribs));
      let rd = '';
      for (let i = 1; i < n; i++) { const v = i / n; rd += line(Pz(bil(0, v), tkm), Pz(bil(1, v), tkm)); }
      add(rd, { s: '#000000', w: 1, o: 0.22 * roofO, c: 'fade' });
      if (fixView) {
        let pd = '';
        [0.06, 0.37, 0.68, 0.96].forEach((u) => { pd += line(Pz(bil(u, 0), -0.05), Pz(bil(u, 1), -0.05)); });
        add(pd, { s: FIXC[fk], w: fk === 'lsf' ? 3 : 4, da: fk === 'naosei' ? '5 5' : '', c: 'fade' });
      }
      if (acc) {
        let sd = '';
        [0.2, 0.55, 0.9].forEach((u) => { for (let v = 0.12; v < 1; v += 0.2) sd += circ(Pz(bil(u, v), tkm), 1.3); });
        add(sd, { f: K, o: kit.parafusos ? 1 : 0, c: 'fade' });
      }
    };
    const pillars = (list) => {
      let fx = '', fy = '';
      list.forEach((p) => { const a = 0.13, x = p[0], y = p[1], z = p[2]; fx += faceX(x - a, y - a, y + a, 0, z); fy += faceY(y - a, x - a, x + a, 0, z); });
      add(fx, { f: WALL2, s: K, w: 1 });
      add(fy, { f: WALL, s: K, w: 1 });
    };
    const box = (x0, x1, y0, y1, z0, z1, cx, cy, ct) => {
      add(faceX(x0, y0, y1, z0, z1), { f: cx, s: K, w: 1.1 });
      add(faceY(y0, x0, x1, z0, z1), { f: cy, s: K, w: 1.1 });
      add(poly([P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)]), { f: ct, s: K, w: 1.1 });
    };
    const casaOpenings = (xf, ya, yb, yf, xa, xb) => {
      const L = yb - ya, dy = ya + 0.35 * L, wy = ya + 0.74 * L;
      add(faceX(xf, wy - 0.6, wy + 0.6, 1.0, 2.0), { f: '#BFD6EA', s: K, w: 1.4 });
      add(faceY(yf, (xa + xb) / 2 - 0.6, (xa + xb) / 2 + 0.6, 1.0, 2.0), { f: '#BFD6EA', s: K, w: 1.4 });
      add(faceX(xf, dy - 0.45, dy + 0.45, 0, 2.1), { f: '#6E4B35', s: K, w: 1.4 });
    };
    const H = WH;
    let ridge = '', rufD = '', vedD = '', ridgeC = '#2B3440';

    if (hs === 'varanda') {
      const d = vdep, a0 = d, a1 = GW - d, b0 = d, b1 = GL - d, Hv = 2.5, Hi = Hv + rz(d), Hc = Hi + 0.5, hw = (a1 - a0) / 2, rc = rz(hw), xm = (a0 + a1) / 2;
      let r1y = b0 + hw, r2y = b1 - hw;
      if (r1y > r2y) { r1y = (b0 + b1) / 2; r2y = r1y; }
      const R1 = [xm, r1y, Hc + rc], R2 = [xm, r2y, Hc + rc];
      const pts2 = [];
      const along = (n0, n1) => { const n = Math.max(1, Math.round((n1 - n0) / 3)); const r = []; for (let i = 0; i <= n; i++) r.push(n0 + (n1 - n0) * i / n); return r; };
      along(0.15, GL - 0.15).forEach((y) => { pts2.push([0.15, y]); pts2.push([GW - 0.15, y]); });
      along(0.15, GW - 0.15).forEach((x) => { pts2.push([x, 0.15]); pts2.push([x, GL - 0.15]); });
      const seen = {}; const uniq = pts2.filter((p) => { const k = f1(p[0]) + ',' + f1(p[1]); if (seen[k]) return false; seen[k] = 1; return true; });
      const mid = (GW + GL) / 2;
      pillars(uniq.filter((p) => p[0] + p[1] > mid).map((p) => [p[0], p[1], Hv]));
      plane([0, GL, Hv], [GW, GL, Hv], [a0, b1, Hi], [a1, b1, Hi], true);
      plane([GW, 0, Hv], [GW, GL, Hv], [a1, b0, Hi], [a1, b1, Hi], true);
      add(faceX(a0, b0, b1, 0, Hc), { f: WALL2, s: K, w: 1.6 });
      add(faceY(b0, a0, a1, 0, Hc), { f: WALL, s: K, w: 1.6 });
      casaOpenings(a0, b0, b1, b0, a0, a1);
      plane([a0, b1, Hc], [a1, b1, Hc], R2, R2, true);
      plane([a1, b0, Hc], [a1, b1, Hc], R1, R2, true);
      plane([a0, b0, Hc], [a0, b1, Hc], R1, R2, false);
      plane([a0, b0, Hc], [a1, b0, Hc], R1, R1, false);
      pillars(uniq.filter((p) => p[0] + p[1] <= mid).map((p) => [p[0], p[1], Hv]));
      plane([0, 0, Hv], [0, GL, Hv], [a0, b0, Hi], [a0, b1, Hi], false);
      plane([0, 0, Hv], [GW, 0, Hv], [a0, b0, Hi], [a1, b0, Hi], false);
      ridge = line(Pz(R1, tkm), Pz(R2, tkm)) + line(P(a0, b0, Hc + tkm), Pz(R1, tkm)) + line(P(a1, b0, Hc + tkm), Pz(R1, tkm)) + line(P(a0, b1, Hc + tkm), Pz(R2, tkm));
      rufD = line(P(a0, b0, Hi + tkm), P(a1, b0, Hi + tkm)) + line(P(a0, b0, Hi + tkm), P(a0, b1, Hi + tkm));
      vedD = line(P(0, 0, Hv + tkm), P(GW, 0, Hv + tkm)) + line(P(0, 0, Hv + tkm), P(0, GL, Hv + tkm));
    } else if (hs === 'plat') {
      const Hr = H + rz(GW / 2), Hp = Hr + 0.5;
      add(poly([P(GW, 0, Hr), P(GW, GL, Hr), P(GW, GL, Hp), P(GW, 0, Hp)]), { f: '#DCCDB6', s: K, w: 1.3 });
      add(poly([P(0, GL, Hr), P(GW / 2, GL, H), P(GW, GL, Hr), P(GW, GL, Hp), P(0, GL, Hp)]), { f: '#EADFCC', s: K, w: 1.3 });
      plane([GW / 2, 0, H], [GW / 2, GL, H], [GW, 0, Hr], [GW, GL, Hr], false, true);
      plane([GW / 2, 0, H], [GW / 2, GL, H], [0, 0, Hr], [0, GL, Hr], true, true);
      add(faceX(0, 0, GL, 0, Hp), { f: WALL2, s: K, w: 1.6 });
      add(faceY(0, 0, GW, 0, Hp), { f: WALL, s: K, w: 1.6 });
      casaOpenings(0, 0, GL, 0, 0, GW);
      add(line(P(0, 0, Hp), P(0, GL, Hp)) + line(P(0, 0, Hp), P(GW, 0, Hp)) + line(P(GW, 0, Hp), P(GW, GL, Hp)) + line(P(0, GL, Hp), P(GW, GL, Hp)), { s: '#FFFFFF', w: 3 });
      ridge = line(P(GW / 2, 0, H + tkm), P(GW / 2, GL, H + tkm));
      ridgeC = '#3E4C5B';
      rufD = line(P(GW, 0, Hr), P(GW, GL, Hr)) + line(P(0, GL, Hr), P(GW, GL, Hr));
    } else if (hs === '1') {
      const hA = H + rz(GW);
      if (isOpen) {
        pillars([[GW - 0.15, GL - 0.15, H], [GW - 0.15, 0.15, H], [0.15, GL - 0.15, hA]]);
        const cx = GW / 2, cy = GL / 2;
        box(cx - 0.9, cx + 0.9, cy - 2.1, cy + 2.1, 0.25, 0.95, '#1E5FA8', '#2F74C0', '#4A8BD1');
        box(cx - 0.75, cx + 0.75, cy - 1.1, cy + 0.9, 0.95, 1.5, '#1E5FA8', '#2F74C0', '#4A8BD1');
        pillars([[0.15, 0.15, hA]]);
      } else {
        add(faceX(0, 0, GL, 0, hA), { f: WALL2, s: K, w: 1.6 });
        add(poly([P(0, 0, 0), P(GW, 0, 0), P(GW, 0, H), P(0, 0, hA)]), { f: WALL, s: K, w: 1.6 });
      }
      if (btype === 'casa') casaOpenings(0, 0, GL, 0, 0, GW);
      plane([GW, 0, H], [GW, GL, H], [0, 0, hA], [0, GL, hA], false);
      ridge = line(P(0, 0, hA + tkm), P(0, GL, hA + tkm));
      rufD = line(P(0, 0, hA + tkm), P(GW, 0, H + tkm));
      vedD = line(P(GW, 0, H + tkm), P(GW, GL, H + tkm));
    } else {
      const topZ = H + rz(GW / 2);
      if (isOpen) {
        pillars([[GW - 0.15, GL - 0.15, H], [GW - 0.15, 0.15, H], [0.15, GL - 0.15, H]]);
        const cx = GW / 2, cy = GL / 2;
        box(cx - 0.9, cx + 0.9, cy - 2.1, cy + 2.1, 0.25, 0.95, '#1E5FA8', '#2F74C0', '#4A8BD1');
        box(cx - 0.75, cx + 0.75, cy - 1.1, cy + 0.9, 0.95, 1.5, '#1E5FA8', '#2F74C0', '#4A8BD1');
        pillars([[0.15, 0.15, H]]);
      } else {
        add(faceX(0, 0, GL, 0, H), { f: WALL2, s: K, w: 1.6 });
        add(faceY(0, 0, GW, 0, H), { f: WALL, s: K, w: 1.6 });
        add(poly([P(0, 0, H), P(GW, 0, H), P(GW / 2, 0, topZ)]), { f: WALL, s: K, w: 1.6 });
      }
      if (hs === 'chale') {
        add(faceY(0, GW / 2 - 0.45, GW / 2 + 0.45, 0, 2.1), { f: '#6E4B35', s: K, w: 1.4 });
        if (topZ > 3.6) add(faceY(0, GW / 2 - 0.5, GW / 2 + 0.5, 2.6, 3.3), { f: '#BFD6EA', s: K, w: 1.4 });
        add(faceY(0, GW * 0.18, GW * 0.18 + 0.9, 0.3, Math.min(0.9, H - 0.05)), { f: '#BFD6EA', s: K, w: 1.2 });
      } else if (btype === 'casa') casaOpenings(0, 0, GL, 0, 0, GW);
      else if (btype === 'galpao') {
        const x0 = 0.28 * GW, x1 = 0.72 * GW, dh = Math.min(4, WH - 0.6);
        add(faceY(0, x0, x1, 0, dh), { f: '#8E99A4', s: K, w: 1.4 });
        let fd = '';
        for (let h = 0.4; h < dh; h += 0.4) fd += line(P(x0, 0, h), P(x1, 0, h));
        add(faceX(0, 0.08 * GL, 0.92 * GL, WH - 1.4, WH - 0.5), { f: '#BFD6EA', s: K, w: 1.4 });
        for (let y = 0.08 * GL + 2; y < 0.92 * GL; y += 2) fd += line(P(0, y, WH - 1.4), P(0, y, WH - 0.5));
        add(fd, { s: K, w: 1, o: 0.45 });
      } else if (btype === 'comercio') {
        add(faceY(0, 0.12 * GW, 0.88 * GW, 0.1, 2.5), { f: '#BFD6EA', s: K, w: 1.4 });
        add(faceY(0, 0.42 * GW, 0.58 * GW, 0, 2.3), { f: '#1F3347', s: K, w: 1.4 });
        add(line(P(0.27 * GW, 0, 0.1), P(0.27 * GW, 0, 2.5)) + line(P(0.73 * GW, 0, 0.1), P(0.73 * GW, 0, 2.5)), { s: K, w: 1, o: 0.45 });
        add(faceX(0, 0.35 * GL, 0.65 * GL, 1.0, 2.2), { f: '#BFD6EA', s: K, w: 1.4 });
        const aw = poly([P(0.06 * GW, 0, 2.9), P(0.94 * GW, 0, 2.9), P(0.94 * GW, -1.1, 2.3), P(0.06 * GW, -1.1, 2.3)]);
        add(aw, { f: '#FFFFFF' });
        let st = '';
        for (let i = 0; i < 8; i += 2) { const t0 = 0.06 + 0.88 * i / 8, t1 = 0.06 + 0.88 * (i + 1) / 8; st += poly([P(t0 * GW, 0, 2.9), P(t1 * GW, 0, 2.9), P(t1 * GW, -1.1, 2.3), P(t0 * GW, -1.1, 2.3)]); }
        add(st, { f: '#E4572E' });
        add(aw, { s: K, w: 1.4 });
      }
      plane([GW, 0, H], [GW, GL, H], [GW / 2, 0, topZ], [GW / 2, GL, topZ], true);
      plane([0, 0, H], [0, GL, H], [GW / 2, 0, topZ], [GW / 2, GL, topZ], false);
      ridge = line(P(GW / 2, 0, topZ + tkm), P(GW / 2, GL, topZ + tkm));
      rufD = 'M' + f1(P(0, 0, H + tkm).x) + ' ' + f1(P(0, 0, H + tkm).y) + ' L' + f1(P(GW / 2, 0, topZ + tkm).x) + ' ' + f1(P(GW / 2, 0, topZ + tkm).y) + ' L' + f1(P(GW, 0, H + tkm).x) + ' ' + f1(P(GW, 0, H + tkm).y);
      vedD = line(P(0, 0, H + tkm), P(0, GL, H + tkm));
    }
    add(vedD, { s: '#F28C28', w: 3, o: acc && kit.vedacao ? 1 : 0, c: 'fade' });
    add(rufD, { s: '#2B3440', w: 3.5, o: acc && kit.rufos ? 1 : 0, c: 'fade' });
    add(ridge, { s: ridgeC, w: 5.5, o: acc && kit.cumeeira ? 1 : 0, c: 'fade' });
    const tf = [tree(GW + 1.1, -1.3), tree(-1.5, GL + 0.5)];
    add(tf.map((t) => t.t).join(''), { f: '#8A5A3C' });
    add(tf.map((t) => t.c).join(''), { f: '#5A9D44', s: '#3B7129', w: 1 });
    // cotas das medidas: largura (azul, sentido da cumeeira) e comprimento (laranja, sentido da água)
    const CW = '#0A4DA2', CL = '#D9661F';
    if (step === 3) {
      add(line(P(-0.9, 0, 0), P(-0.9, GL, 0)), { s: CW, w: focus === 'w' ? 4 : 2.5, da: '4 4' });
      add(line(P(0, -0.9, 0), P(GW, -0.9, 0)), { s: CL, w: focus === 'l' ? 4 : 2.5, da: '4 4' });
    }
    const blank = { d: '', f: 'none', s: 'none', w: 0, o: 0, da: '', c: '' };
    const Hs = {};
    for (let i = 0; i < 72; i++) Hs['p' + i] = items[i] || blank;

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const midW = P(GW / 2, -0.9, 0), midL = P(-0.9, GL / 2, 0);
    const tagW = { cls: focus === 'w' ? 'tag on' : 'tag', left: f1(clamp(midL.x - 30, 190, 358 - 136)), top: f1(clamp(midL.y - 8, 6, stageH - 50)) };
    const tagL = { cls: focus === 'l' ? 'tag on' : 'tag', left: f1(clamp(midW.x - 150, 6, 20)), top: f1(clamp(midW.y - 8, 6, stageH - 50)) };
    const mirrorT = (s.mirror && step !== 3) ? 'translate(358 0) scale(-1 1)' : 'translate(0 0)';

    // ---------- Etapa "Você conhece o PIR?" (entre o Kit e o Orçamento) ----------
    // pirAns: 'sim' | 'nao' | 'eps' | 'pulou' | 'viu' (aparece uma vez); pirMode: 'cards' quando os cards estão abertos
    const pirMode = s.pirMode || null;
    const pirView = !!pirMode || (step === 9 && !s.pirAns);
    const pirIdx = s.pirIdx || 0;
    const PIR_N = 4;
    const closePir = () => set({ pirMode: null, pirReturn: null, pirIdx: 0 });
    // dados oficiais (kingspan-isoeste.com.br, 07/10/2026), versão aço/aço com forro
    const TECH = {
      trap: { bom: { mm: 20, U: '1,10', vao: '2,30', peso: '9,3' }, melhor: { mm: 30, U: '0,73', vao: '2,60', peso: '9,7' }, max: { mm: 50, U: '0,44', vao: '3,00', peso: '10,5' } },
      colonial: { mm: 40, U: '0,55', vao: '1,75', peso: '9,1' }
    };
    const tech = telha.id === 'trap' ? TECH.trap[comfortId] : (telha.id === 'colonial' ? TECH.colonial : null);
    const GUIA = telha.id === 'colonial'
      ? 'https://downloads.kingspan-isoeste.com.br/guias-rapidos/Kingspan-Isoeste-Isotelha-Colonial-Guia-Rapido-de-Instalacao-PT-BR.pdf'
      : 'https://downloads.kingspan-isoeste.com.br/guias-rapidos/Kingspan-Isoeste-Isotelha-Trapezoidal-Guia-Rapido-de-Instalacao-PT-BR.pdf';
    const pir = {
      mode: pirMode, idx: pirIdx, n: PIR_N, eps: s.pirAns === 'eps', tech, roofHex: color.hex,
      telhaCurto: telha.curto, colonial: telha.id === 'colonial', guia: GUIA, fromTelha: !!s.pirReturn,
      sim: () => set({ pirAns: 'sim' }),
      nao: () => set({ pirAns: 'nao', pirMode: 'cards', pirIdx: 0 }),
      epsGo: () => set({ pirAns: 'eps', pirMode: 'cards', pirIdx: 1 }),
      // colonial só tem 40 mm: a opção mais econômica é trocar para a trapezoidal 20 mm
      econ: () => set(telha.id === 'colonial' ? { pirMode: null, pirIdx: 0, step: 6, telha: 'trap', comfort: 'bom', color: undefined } : { pirMode: null, pirIdx: 0, step: 6, comfort: 'bom' }),
      econTxt: telha.id === 'colonial' ? 'Ver a trapezoidal, mais econômica' : 'Ver uma opção mais econômica',
      dots: Array.from({ length: PIR_N }, (_, i) => ({ cls: i === pirIdx ? 'dot on' : 'dot', go: () => set({ pirIdx: i }) }))
    };
    const openPir = () => set({ pirMode: 'cards', pirIdx: 0, pirReturn: step === 4 ? 4 : null, pirAns: s.pirAns || 'viu' });
    const fin = step === 9 && !pirView;

    // ---------- Progresso ----------
    const NAMES = ['Área', 'Medidas', 'Telha', 'Conforto', 'Kit', 'Pronto'];
    const phase = [0, 1, 2, 2, 3, 3, 4, 5, 5, 6][step];
    const segs = NAMES.map((n, i) => ({ cls: (i < phase - 1 || fin) ? 'seg done' : (i === phase - 1 ? 'seg cur' : 'seg') }));
    const phaseLabel = step === 0 ? 'Obra · vamos começar' : (fin ? 'Obra concluída' : (step === 9 ? 'Obra · Pronto' : 'Obra · ' + NAMES[phase - 1]));
    const phaseCount = phase + '/6';

    // ---------- Opções ----------
    const AREAS = [
      { id: 'casa', nome: 'Casa', sub: 'O telhado da sua casa', icon: 'M5 15 L16 6 L27 15 M8 13 V26 H24 V13 M13 26 V19 H19 V26' },
      { id: 'gourmet', nome: 'Área gourmet ou garagem', sub: 'Varanda, churrasqueira, carro', icon: 'M4 12 L16 6 L28 12 M7 11 V27 M25 11 V27 M10 24 V20 L12.5 16.5 H19.5 L22 20 V24 Z M12.5 24 V26 M19.5 24 V26' },
      { id: 'galpao', nome: 'Galpão', sub: 'Depósito, oficina, barracão', icon: 'M4 27 V14 Q16 3 28 14 V27 Z M11 27 V19 H21 V27 M11 22.5 H21' },
      { id: 'comercio', nome: 'Comércio', sub: 'Loja, escritório, salão', icon: 'M5 12 H27 L25 6 H7 Z M5 12 Q8 16 11 12 Q14 16 17 12 Q20 16 23 12 Q26 16 27 12 M7 15 V27 H25 V15 M13 27 V20 H19 V27' }
    ];
    const areas = AREAS.map((a) => ({ ...a, on: area === a.id, cls: area === a.id ? 'opt on' : 'opt', pick: () => set({ area: a.id, w: DIMS[a.id][0], l: DIMS[a.id][1], shape: null }) }));
    const models = TELHAS.map((t) => ({ curto: t.curto, pick: () => set({ telha: t.id, knownTelha: true, area: area || 'casa', step: 2, color: undefined }) }));
    const PRIOS = [

${pRow(PI.feather, 'Leve', `Cerca de ${t.peso} kg/m², alivia a estrutura do telhado.`)}
${pRow(PI.ceil, 'Dispensa forro', 'O acabamento de baixo já vem pronto.')}

function morph(a, b) {

  if (a.nodeType === 1 && b.nodeType === 1 && a.hasAttribute('data-keep') && b.hasAttribute('data-keep')) return;

      (a.nodeType === 1 && a.getAttribute('data-k') !== b.getAttribute('data-k'))) {
    a.replaceWith(b.cloneNode(true)); return;
  }
  if (a.nodeType !== 1) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  for (const at of Array.from(a.attributes)) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for (const at of Array.from(b.attributes)) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  if (a.tagName === 'INPUT') {
    if (a.type === 'checkbox') a.checked = b.hasAttribute('checked');
    else { const nv = b.getAttribute('value') || ''; if (a.value !== nv) a.value = nv; }
  }
  if (a.tagName === 'BUTTON') a.disabled = b.hasAttribute('disabled');
  const ac = Array.from(a.childNodes), bc = Array.from(b.childNodes);
  for (let i = 0; i < bc.length; i++) { if (i < ac.length) morph(ac[i], bc[i]); else a.appendChild(bc[i].cloneNode(true)); }
  for (let i = bc.length; i < ac.length; i++) ac[i].remove();
}

  // =====================================================================
  //  CICLO DE VIDA
  // =====================================================================
  componentDidMount() { this._alive = true; setTimeout(() => this._tryInit(), 0); }
  componentDidUpdate() { if (this._E && this._E.ready) this._sync(false); }
  componentWillUnmount() { this._alive = false; this._teardown(); }

  _tryInit() {
    if (this._E || !this._cv || this._failed) return;
    const T = window.THREE;
    if (!T) {
      this._waitN = (this._waitN || 0) + 1;
      if (this._waitN === 4) this._loadThree();
      clearTimeout(this._waitT);
      if (this._waitN < 300) this._waitT = setTimeout(() => this._tryInit(), 100);
      else { this._failed = true; this.setState({ glFail: true }); }
      return;
    }
    try { this._init(T); this._E.ready = true; this._sync(true); this.setState({ glReady: true }); setTimeout(() => { if (this._alive && !(this.state || {}).touched) this.setState({ touched: true }); }, 9000); }
    catch (e) { console.error('[3D]', e); this._failed = true; this._E = null; this.setState({ glFail: true }); }
  }

  // carrega o three.js se a página ainda não trouxe: tenta cada endereço até um funcionar
  _loadThree() {
    if (window.THREE || window.__threeLoading) return;
    const urls = ["./three.min.js", "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js", "https://unpkg.com/three@0.159.0/build/three.min.js"];
    if (!urls.length) return;
    const tail = urls[0].split('/').slice(-3).join('/');
    if ([].slice.call(document.scripts).some((x) => x.src && x.src.indexOf(tail) >= 0)) return;
    let i = 0;
    const next = () => {
      if (window.THREE || i >= urls.length) { window.__threeLoading = false; return; }
      const el = document.createElement('script'); el.src = urls[i++]; el.async = true;
      el.onerror = () => { el.remove(); next(); };
      document.head.appendChild(el);
    };
    window.__threeLoading = true; next();
  }

  // acompanha o tamanho da área do 3D (celular girando, janela mudando)
  _resize() {
    const E = this._E, cv = this._cv; if (!E || !cv) return;
    const W = cv.clientWidth, H = cv.clientHeight;
    if (!W || !H || (W === E.W && H === E.H)) return;
    E.W = W; E.H = H;
    const OFF = 46;
    E.cam.aspect = W / (H + OFF);
    E.cam.setViewOffset(W, H + OFF, 0, OFF, W, H);
    E.R.setSize(W, H, false);
    E.dirty = true;
  }

  _teardown() {
    const E = this._E; if (!E) return;
    E.dead = true; cancelAnimationFrame(E.raf);
    if (E.io) E.io.disconnect();
    if (E.ro) E.ro.disconnect();
    try { E.R.dispose(); E.R.forceContextLoss(); } catch (e) { /* ignore */ }
    this._E = null;
  }

  // =====================================================================
  //  MOTOR 3D (three.js)
  // =====================================================================
  _init(T) {
    const cv = this._cv;
    const W = cv.clientWidth || 390, H = cv.clientHeight || 430;
    const R = new T.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    R.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    R.setSize(W, H, false);
    R.outputColorSpace = T.SRGBColorSpace;
    R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.0;
    R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
    const scene = new T.Scene();
    const OFF = 46;
    const cam = new T.PerspectiveCamera(30, W / (H + OFF), 0.1, 900);
    cam.setViewOffset(W, H + OFF, 0, OFF, W, H);
    const E = this._E = { T, R, scene, cam, W, H, tex: {}, geo: {}, mat: {}, pieces: [], flows: [], heatVols: [], handles: [], labels: [], ex: 0, exTarget: 0, dirty: true, visible: true };
    E.accent = new T.Color(this.props.accent || '#0A4DA2');
    this._mkTextures(); this._mkMaterials(); this._mkSky(); this._mkLights(); this._mkEnv(); this._mkParticles();
    E.orb = { tx: 4, ty: 1.5, tz: 8, r: 45, th: 0.62, ph: 0.98, vth: 0, vph: 0 };
    E.ray = new T.Raycaster();
    this._bindInput();
    E.last = performance.now();
    E.loop = () => this._frame();
    E.raf = requestAnimationFrame(E.loop);
    if (window.IntersectionObserver) { E.io = new IntersectionObserver((en) => { E.visible = en[0] ? en[0].isIntersecting : true; }); E.io.observe(cv); }
    if (window.ResizeObserver) { E.ro = new ResizeObserver(() => this._resize()); E.ro.observe(cv); }
  }

  _rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  _cvs(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  _tx(c, rep) { const E = this._E, T = E.T; const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; if (rep) { t.wrapS = t.wrapT = T.RepeatWrapping; } t.anisotropy = Math.min(8, E.R.capabilities.getMaxAnisotropy()); return t; }

  _mkTextures() {
    const E = this._E, X = E.tex, rnd = this._rng(11);
    const noise = (g, w, h, n, f) => { for (let i = 0; i < n; i++) f(g, rnd() * w, rnd() * h); };
    // grama
    let c = this._cvs(512, 512), g = c.getContext('2d');
    g.fillStyle = '#86A865'; g.fillRect(0, 0, 512, 512);
    for (let q = 0; q < 8; q++) { g.fillStyle = q % 2 ? 'rgba(255,255,230,0.035)' : 'rgba(40,70,20,0.035)'; g.fillRect(q * 64, 0, 64, 512); }
    for (let q = 0; q < 70; q++) { const x = rnd() * 512, y = rnd() * 512, r = 40 + rnd() * 90; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, rnd() < 0.5 ? 'rgba(80,110,45,0.16)' : 'rgba(160,185,100,0.14)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
    noise(g, 512, 512, 22000, (g2, x, y) => { g2.fillStyle = 'hsla(' + (80 + rnd() * 22) + ',' + (30 + rnd() * 20) + '%,' + (34 + rnd() * 24) + '%,' + (0.08 + rnd() * 0.12) + ')'; g2.fillRect(x, y, 1, 2 + rnd() * 3); });
    X.grass = this._tx(c, true);
    // reboco
    c = this._cvs(256, 256); g = c.getContext('2d'); g.fillStyle = '#F3F0EA'; g.fillRect(0, 0, 256, 256);
    noise(g, 256, 256, 9000, (g2, x, y) => { const v = rnd() < 0.5 ? 0 : 255; g2.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + (0.025 + rnd() * 0.04) + ')'; g2.fillRect(x, y, 1.5, 1.5); });
    X.plaster = this._tx(c, true);
    // concreto
    c = this._cvs(256, 256); g = c.getContext('2d'); g.fillStyle = '#C9C7C2'; g.fillRect(0, 0, 256, 256);
    noise(g, 256, 256, 12000, (g2, x, y) => { const v = Math.floor(150 + rnd() * 90); g2.fillStyle = 'rgba(' + v + ',' + v + ',' + (v - 4) + ',0.35)'; g2.fillRect(x, y, 1.3, 1.3); });
    X.concrete = this._tx(c, true);
    // piso intertravado
    c = this._cvs(512, 512); g = c.getContext('2d'); g.fillStyle = '#8F8A84'; g.fillRect(0, 0, 512, 512);
    for (let yy = 0; yy < 512; yy += 32) for (let xx = (yy / 32) % 2 ? -32 : 0; xx < 512; xx += 64) { const v = Math.floor(168 + rnd() * 34); g.fillStyle = 'rgb(' + v + ',' + (v - 6) + ',' + (v - 14) + ')'; g.fillRect(xx + 2, yy + 2, 60, 28); }
    X.paver = this._tx(c, true);
    // asfalto
    c = this._cvs(256, 256); g = c.getContext('2d'); g.fillStyle = '#44484D'; g.fillRect(0, 0, 256, 256);
    noise(g, 256, 256, 14000, (g2, x, y) => { const v = Math.floor(40 + rnd() * 70); g2.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.5)'; g2.fillRect(x, y, 1.2, 1.2); });
    X.asphalt = this._tx(c, true);

  _frame() {

      const a = E.tw.t, e = a < 0.5 ? 4 * a * a * a : 1 - Math.pow(-2 * a + 2, 3) / 2;

  // ---------- construção da casa ----------
  _box(g, x0, y0, z0, x1, y1, z1, mat, ud, noCast) {
    const T = this._E.T;
    const ao = mat.vertexColors && y0 < 0.5;
    const hs = ao ? Math.min(12, Math.max(1, Math.ceil((y1 - y0) / 0.25))) : 1;
    const geo = new T.BoxGeometry(Math.max(0.002, x1 - x0), Math.max(0.002, y1 - y0), Math.max(0.002, z1 - z0), 1, hs, 1);
    if (mat.vertexColors) {

      for (let q = 0; q < ps.count; q++) { const yy = ps.getY(q) + cy; const v = 1 - 0.32 * Math.exp(-Math.max(0, yy) / 0.45); cl[q * 3] = v; cl[q * 3 + 1] = v; cl[q * 3 + 2] = v; }
      geo.setAttribute('color', new T.BufferAttribute(cl, 3));
    }
    const me = new T.Mesh(geo, mat);
    me.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    if (mat.userData && mat.userData.uvs) this._worldUV(me, mat.userData.uvs);
    me.castShadow = !noCast; me.receiveShadow = true;
    if (ud) Object.assign(me.userData, ud);
    g.add(me); return me;
  }

  // texturas em escala real (metros), sem esticar

    const gm = me.geometry, ps = gm.attributes.position, nm = gm.attributes.normal, uv = gm.attributes.uv, o = me.position;
    for (let q = 0; q < ps.count; q++) {
      const x = ps.getX(q) + o.x, y = ps.getY(q) + o.y, z = ps.getZ(q) + o.z;
      const ax = Math.abs(nm.getX(q)), ay = Math.abs(nm.getY(q));
      if (ax > 0.5) uv.setXY(q, z / sc, y / sc); else if (ay > 0.5) uv.setXY(q, x / sc, z / sc); else uv.setXY(q, x / sc, y / sc);
    }
    uv.needsUpdate = true;
  }

  _dispose(o) {
    o.traverse((n) => {
      if (n.geometry && !(n.geometry.userData && n.geometry.userData.keep)) n.geometry.dispose();
      if (n.userData && n.userData.own && n.material) { if (n.material.map) n.material.map.dispose(); n.material.dispose(); }
    });
  }

  _buildHouse(m, blocks) {
    const E = this._E, T = E.T, k = this.kfg();
    if (E.house) { E.scene.remove(E.house); this._dispose(E.house); }
    const Hg = new T.Group(); E.house = Hg; E.scene.add(Hg);
    [E.hlMats, E.dimMats].forEach((mp) => { if (mp) { mp.forEach((x) => x.dispose()); mp.clear(); } });
    E.pieces = []; E.flows = []; E.heatVols = []; E.blockGroups = []; E.frames = []; E.roofMeshes = []; E.house0 = null; E.capInfo = null;
    const col = k.COLORS.find((c) => c.id === m.color) || k.COLORS[1];
    E.mat.roof.color.set(col.hex);
    E.doorAt = null; E.ripadoAt = null; E.gates = null; E.galpao = !!m.galpao;

    blocks.forEach((b) => { x0 = Math.min(x0, b.x); x1 = Math.max(x1, b.x + b.w); z0 = Math.min(z0, b.y); z1 = Math.max(z1, b.y + b.d); });
