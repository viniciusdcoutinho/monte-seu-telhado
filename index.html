<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F8">
<title>Monte seu Telhado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna, altura da tela; casa fixa no topo, conteúdo rola, botão fixo embaixo */
:root{
  --p:#0A4DA2; --pSoft:color-mix(in oklab,#0A4DA2 22%,transparent);
  --ink:#0F1E2E; --muted:#46556A; --ground:#F4F6F8; --line:#DAE1E8; --outer:#DDE3EA;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
#app{height:100%;display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:430px;height:100%;position:relative;overflow:hidden;background:var(--ground);display:flex;flex-direction:column}
@media (min-width:600px) and (min-height:700px){.app{height:min(844px,calc(100% - 40px));border-radius:36px;box-shadow:0 30px 80px rgba(15,30,46,.25),0 0 0 10px #10263F}}
.h1{font-family:var(--display);font-weight:700;font-size:27px;line-height:1.12;letter-spacing:-0.015em;margin:0;text-wrap:balance}
.sub{font-size:15px;line-height:1.45;color:var(--muted);margin:0;text-wrap:pretty}
.screen{display:flex;flex-direction:column;gap:18px;animation:rise .35s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 2px rgba(15,30,46,.1);flex-shrink:0}
.seg{flex:1;height:8px;border-radius:4px;background:#D3DBE3;transition:background .3s}
.seg.done{background:var(--p)}
.seg.cur{background:linear-gradient(90deg,var(--p) 50%,#D3DBE3 50%)}
.stage{margin:0 -4px 20px;border-radius:24px;background:#CFE3F5;position:relative;overflow:hidden;flex-shrink:0;transition:height .35s}
.stage-in{position:absolute;left:50%;top:0;width:358px;transform-origin:top center}
.cta{width:100%;height:56px;border:0;border-radius:18px;background:var(--p);color:#fff;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,opacity .2s;box-shadow:0 6px 16px var(--pSoft)}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.link{background:none;border:0;color:var(--p);font-weight:700;font-size:15px;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;align-self:center}
.opt{position:relative;border:2px solid var(--line);background:#fff;border-radius:22px;cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s;text-align:left;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:44px}
.opt:active{transform:scale(.97)}
.opt.on{border-color:var(--p);box-shadow:0 0 0 4px var(--pSoft)}
.chk{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:12px;background:var(--p);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.4);transition:all .2s}
.opt.on .chk{opacity:1;transform:scale(1)}
.ico{width:52px;height:52px;border-radius:16px;background:#EEF3F8;display:flex;align-items:center;justify-content:center;color:var(--p);transition:background .2s,color .2s}
.opt.on .ico{background:var(--p);color:#fff}
.otitle{font-weight:700;font-size:16px;line-height:1.2}
.odesc{font-size:13px;color:#56657A;line-height:1.35}
.field{width:100%;height:56px;border-radius:16px;border:2px solid #CFD8E1;background:#fff;font-size:20px;font-weight:600;padding:0 16px;letter-spacing:.04em;font-family:inherit;color:var(--ink)}
.field:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--pSoft)}
.ok{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:#E3F3EA;color:#155C39;font-size:14px;font-weight:600;animation:rise .3s both}
.chip{min-height:44px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:600;font-size:15px;cursor:pointer}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 30px 10px;margin:0 -20px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.gcard{flex:0 0 290px;scroll-snap-align:center;border-radius:26px;background:#10263F;color:#fff;padding:14px;display:flex;flex-direction:column;gap:12px;border:3px solid #2A4563;animation:deal .5s cubic-bezier(.2,.8,.2,1.2) both}
.gcard.ideal{border-color:#F29A3F;box-shadow:0 10px 28px rgba(242,154,63,.35)}
@keyframes deal{from{opacity:0;transform:translateY(30px) rotate(-4deg) scale(.9)}to{opacity:1;transform:none}}
.badge{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:8px;background:#2A4563;color:#fff}
.gcard.ideal .badge{background:#F29A3F;color:#1F1200}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:#F5A650;animation:grow .8s .2s ease-out both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dot{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.dot i{width:8px;height:8px;border-radius:4px;background:#B9C4CF;transition:all .25s}
.dot.on i{width:22px;background:var(--p)}
.sw{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0;font-size:14px;font-weight:600;min-height:44px}
.sw .ring{width:68px;height:68px;border-radius:34px;padding:5px;border:3px solid transparent;transition:border-color .2s,transform .2s;display:block}
.sw.on .ring{border-color:var(--p);transform:scale(1.06)}
.sw .fill{display:block;width:100%;height:100%;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.12)}
.tip{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:16px;background:#FFF3E3;color:#6B3A00;font-size:14px;line-height:1.4;animation:rise .3s both}
.seal{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.04em;padding:4px 10px;border-radius:8px;background:#FFE1BF;color:#7A3D00;text-transform:uppercase}
.extra{font-weight:800;font-size:15px;white-space:nowrap;text-align:right}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.shape.wide{grid-column:span 2;flex-direction:row;align-items:center}
.stepper{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px;border:2px solid var(--line)}
.stepper .mid{flex-grow:1;text-align:center;display:flex;flex-direction:column}
.stepper .lbl{font-size:13px;font-weight:700;color:#56657A}
.sbtn{width:52px;height:52px;border-radius:16px;border:0;background:#EEF3F8;color:var(--p);font-size:26px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s;touch-action:manipulation}
.sbtn:active{transform:scale(.92);background:var(--pSoft)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slope{border:2px solid var(--line);background:#fff;border-radius:16px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:700;cursor:pointer;color:#34435A}
.slope.on{border-color:var(--p);color:var(--p);box-shadow:0 0 0 3px var(--pSoft)}
.result{border-radius:22px;background:#10263F;color:#fff;padding:18px;display:flex;flex-direction:column;gap:4px}
.big{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tag{position:absolute;min-height:44px;padding:0 12px;font-size:13px!important;border-radius:22px;border:2px solid var(--p);background:#fff;color:var(--p);font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 4px 10px rgba(15,30,46,.15);transition:background .2s,color .2s}
.tag.on{background:var(--p);color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--pSoft)}50%{box-shadow:0 0 0 8px transparent}}
.kitrow{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:18px;background:#fff;border:2px solid var(--line);cursor:pointer;transition:all .2s;position:relative}
.kitrow.on{border-color:#BFD2E6}
.kitrow.off{background:#F7F8FA;border-style:dashed}
.kitrow.off .otitle,.kitrow.off .odesc{opacity:.6}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.box{width:28px;height:28px;border-radius:9px;border:2px solid #B5C1CD;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;color:transparent}
.kitrow.on .box{background:var(--p);border-color:var(--p);color:#fff}
.kitrow:focus-within{box-shadow:0 0 0 4px var(--pSoft)}
.warn{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:#FFF3E3;color:#6B3A00;font-size:14px;line-height:1.4;animation:rise .25s both}
.complete{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#E3F3EA;color:#155C39;font-weight:800;animation:pop .45s both}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.sum{background:#fff;border-radius:22px;border:2px solid var(--line);overflow:hidden}
.sumhead{width:100%;min-height:56px;border:0;background:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:16px;font-weight:700;cursor:pointer}
.chev{transition:transform .25s}
.chev.open{transform:rotate(180deg)}
.line{display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:1.35;font-variant-numeric:tabular-nums}
.muted{color:#56657A}
.line>:last-child{white-space:nowrap}
.result .big{font-size:26px}
.sec{min-height:48px;border-radius:16px;border:2px solid #CBD5DF;background:#fff;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;flex:1;padding:0 8px}
.fade{transition:opacity .45s}
.roof{transition:fill .5s}
.houseB{transform-box:fill-box;transform-origin:center}
.houseB.pop{animation:pop .6s both}
.conf{position:absolute;top:-20px;width:9px;height:15px;border-radius:2px;animation:fall 2.8s ease-in both;pointer-events:none}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(900px) rotate(620deg);opacity:.3}}
.toast{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;border-radius:14px;background:#E3F3EA;color:#155C39;font-weight:700;animation:pop .4s both}
.ctabar{position:absolute;left:0;right:0;bottom:0;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));background:var(--ground);box-shadow:0 -8px 24px rgba(15,30,46,.08)}
.scroll{flex-grow:1;min-height:0;overflow-y:auto;padding:4px 20px 130px;-webkit-overflow-scrolling:touch}
button:focus-visible,input:focus-visible{outline:3px solid var(--p);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ico2{width:64px;height:64px;border-radius:18px;background:#EEF3F8;display:flex;align-items:center;justify-content:center}
.note{font-size:14px;color:#46556A;background:#EEF3F8;border-radius:14px;padding:12px 14px;line-height:1.4}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<div id="app"></div>
<script>
class DCLogic {
  constructor() { this.props = {}; this.state = {}; }
  setState(p) { this.state = Object.assign({}, this.state, p); scheduleRender(); }
}
class Component extends DCLogic {
  st(k, blank, demo) {
    const s = this.state || {};
    if (s[k] !== undefined) return s[k];
    return Number(this.props.startStep || 0) > 0 ? demo : blank;
  }
  renderVals() {
    const self = this;
    const s = this.state || {};
    const start = Number(this.props.startStep || 0);
    const step = s.step !== undefined ? s.step : start;
    const accent = this.props.accent || '#0A4DA2';
    const set = (p) => self.setState(p);
    const go = (n) => set({ step: n, alertKey: null });
    const f1 = (n) => n.toFixed(1);
    const nf = (n, d) => n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
    const money = (n) => 'R$ ' + nf(n, 2);

    // ---------- CEP e fábrica ----------
    const cep = this.st('cep', '', '75132-000');
    const digits = cep.replace(/\D/g, '');
    const cepOk = digits.length === 8;
    const p2 = parseInt(digits.slice(0, 2) || '0', 10);
    let fab = 'Anápolis (GO)', dias = 4;
    if (p2 >= 78 && p2 <= 79) { fab = 'Várzea Grande (MT)'; dias = 5; }
    else if (p2 >= 80) { fab = 'Araquari (SC)'; dias = 5; }
    else if (p2 >= 66 && p2 <= 69) { fab = 'Várzea Grande (MT)'; dias = 12; }
    else if (p2 >= 50 && p2 <= 56) { fab = 'Vitória de Santo Antão (PE)'; dias = 5; }
    else if (p2 >= 40 && p2 <= 65) { fab = 'Vitória de Santo Antão (PE)'; dias = 8; }
    else if (p2 >= 20 && p2 <= 39) { fab = 'Cambuí (MG)'; dias = 5; }
    else if (p2 >= 1 && p2 <= 19) { fab = 'Cambuí (MG)'; dias = 4; }
    const onCep = (e) => {
      const d = String(e.target.value).replace(/\D/g, '').slice(0, 8);
      set({ cep: d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d });
    };

    // ---------- Telhas ----------
    const TELHAS = [
      { id: 'trap', img: 'https://t56141.vtexassets.com/arquivos/ids/162027-1200-auto?v=638824150350300000&width=1200&height=auto&aspect=true', nome: 'Telha Térmica Trapezoidal', curto: 'Trapezoidal', desc: 'Resistente e versátil, vai bem em quase todo telhado.', termico: 4, silencio: 4, preco: 4, base: 119, ribs: 2.2, profile: 'M0 60 H18 L30 30 H52 L64 60 H84 L96 30 H118 L130 60 H150 L162 30 H184 L196 60 H216 L228 30 H250 L262 60' },
      { id: 'colonial', img: 'https://t56141.vtexassets.com/arquivos/ids/165766-1200-auto?v=639217235976000000&width=1200&height=auto&aspect=true', nome: 'Telha Térmica Colonial', curto: 'Colonial', desc: 'Visual de telha de barro, sem o peso.', termico: 4, silencio: 4, preco: 3, base: 149, ribs: 3.6, profile: 'M0 55 Q16 20 32 55 Q48 20 64 55 Q80 20 96 55 Q112 20 128 55 Q144 20 160 55 Q176 20 192 55 Q208 20 224 55 Q240 20 262 55' },
      { id: 'ond', img: 'https://t56141.vtexassets.com/arquivos/ids/157344-1200-auto?v=638364229269630000&width=1200&height=auto&aspect=true', nome: 'Telha Residence', curto: 'Residence', desc: 'Linha pensada para telhados de casas.', termico: 3, silencio: 3, preco: 5, base: 99, ribs: 4.6, profile: 'M0 45 C10 30 20 30 30 45 S50 60 60 45 S80 30 90 45 S110 60 120 45 S140 30 150 45 S170 60 180 45 S200 30 210 45 S230 60 240 45 S256 34 262 40' }
    ];
    const area = this.st('area', null, 'casa');
    const btype = area || 'casa';
    const prios = this.st('prios', [], ['fresca', 'silencio']);
    const revealed = s.revealed !== undefined ? s.revealed : Number(this.props.startReveal || 0) > 0;
    const has = (k) => prios.indexOf(k) >= 0;
    const score = (t) => (has('fresca') ? t.termico : 0) + (has('silencio') ? t.silencio : 0) + (has('preco') ? t.preco * 1.3 : 0) + (has('colonial') && t.id === 'colonial' ? 10 : 0) + (t.id === 'trap' ? 0.5 : 0);
    const ordered = TELHAS.slice().sort((a, b) => score(b) - score(a));
    const cardIdx = s.cardIdx || 0;
    const telhaId = s.telha || (start > 0 ? 'trap' : ordered[0].id);
    const telha = TELHAS.find((t) => t.id === telhaId) || TELHAS[0];

    const COLORS = [
      { id: 'branco', nome: 'Branco', hex: '#EEF1F3' },
      { id: 'cinza', nome: 'Cinza claro', hex: '#AEB7C0' },
      { id: 'grafite', nome: 'Grafite', hex: '#454D57' },
      { id: 'terracota', nome: 'Terracota', hex: '#B5523B' },
      { id: 'azul', nome: 'Azul', hex: '#2F5E8C' },
      { id: 'verde', nome: 'Verde', hex: '#4F7A5A' }
    ];
    const colorId = s.color || (telha.id === 'colonial' ? 'terracota' : 'grafite');
    const color = COLORS.find((c) => c.id === colorId) || COLORS[2];
    const roofHex = step >= 5 ? color.hex : '#9AA5B1';
    const shadeHex = (hex, k) => { const n = parseInt(hex.slice(1), 16); const r = Math.round(((n >> 16) & 255) * k), g = Math.round(((n >> 8) & 255) * k), b = Math.round((n & 255) * k); return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); };
    const roofDark = shadeHex(roofHex, 0.8);

    const COMF = [
      { id: 'bom', nome: 'Bom', mm: '30 mm', desc: 'Para garagens, varandas e áreas abertas.', extraV: 0, level: 0.35 },
      { id: 'melhor', nome: 'Melhor', mm: '50 mm', desc: 'Ideal para quartos, salas e cozinha.', extraV: 18, level: 0.68, rec: true },
      { id: 'max', nome: 'Máximo', mm: '80 mm', desc: 'Para regiões muito quentes ou ambientes com ar-condicionado.', extraV: 39, level: 1 }
    ];
    const comfortId = s.comfort || 'melhor';
    const comfort = COMF.find((c) => c.id === comfortId);
    const tk = step >= 6 ? ({ bom: 3, melhor: 5, max: 7 })[comfortId] : 3;

    // ---------- Formato e medidas ----------
    const isCasa = btype === 'casa';
    const shape = this.st('shape', null, '2');
    const SH = shape || (btype === 'gourmet' ? '1' : '2');
    const hs = ['1', '2', 'chale', 'plat', 'varanda'].indexOf(SH) >= 0 ? SH : '2';
    const DIMS = { casa: [7, 9], gourmet: [6, 4], galpao: [20, 12], comercio: [12, 8] };
    const dims = DIMS[btype];
    const w = s.w !== undefined ? s.w : dims[0];
    const l = s.l !== undefined ? s.l : dims[1];
    const GW = l, GL = w;
    const SLOPES = [
      { id: 'reto', nome: 'Quase reto', v: 0.10, k: 5 },
      { id: 'medio', nome: 'Médio', v: 0.15, k: 10 },
      { id: 'inclinado', nome: 'Bem inclinado', v: 0.25, k: 18 }
    ];
    const slopeId = s.slope || 'medio';
    const sv = hs === 'chale' ? 1.0 : SLOPES.find((x) => x.id === slopeId).v;
    const focus = s.focus || 'w';
    const knowSize = !!s.knowSize;
    const kLen = s.kLen !== undefined ? s.kLen : 5.2;
    const kQty = s.kQty !== undefined ? s.kQty : 14;
    const vdep = Math.max(1.2, Math.min(2, GW / 4, GL / 4));
    const coreW = GW - 2 * vdep, coreL = GL - 2 * vdep;

    // ---------- Fixação ----------
    const fix = this.st('fix', null, 'madeira');

    // ---------- Cálculo das telhas (largura útil 1,00 m) ----------
    const cosA = 1 / Math.sqrt(1 + sv * sv);
    const up10 = (x) => Math.ceil(x * 10 - 1e-6) / 10;
    let pieces;
    if (knowSize) pieces = [{ qty: kQty, len: kLen }];
    else if (hs === '1') pieces = [{ qty: Math.ceil(GL - 1e-6), len: up10((GW + 0.6) / cosA) }];
    else if (hs === 'plat') pieces = [{ qty: Math.ceil(GL - 1e-6) * 2, len: up10((GW / 2 + 0.1) / cosA) }];
    else if (hs === 'varanda') {
      const len1 = up10((coreW / 2 + 0.3) / cosA), len2 = up10((vdep + 0.3) / cosA);
      pieces = [{ qty: Math.ceil(coreW * coreL / cosA / len1), len: len1 }, { qty: Math.ceil((GW * GL - coreW * coreL) / cosA / len2), len: len2 }];
    }
    else pieces = [{ qty: Math.ceil(GL - 1e-6) * 2, len: up10((GW / 2 + 0.6) / cosA) }];
    const tQty = pieces.reduce((a, p) => a + p.qty, 0);
    const areaM2 = pieces.reduce((a, p) => a + p.qty * p.len, 0);
    const tLen = Math.max.apply(null, pieces.map((p) => p.len));
    const aguas = hs === '1' ? 1 : 2;
    const resultTxt = pieces.map((p, i) => (i ? p.qty + ' de ' : p.qty + ' telhas de ') + nf(p.len, 2) + ' m').join(' + ');

    // ---------- Kit ----------
    const kit = s.kit || { cumeeira: true, rufos: true, parafusos: true, vedacao: true };
    const alertKey = s.alertKey || null;
    let top;
    if (hs === 'plat') top = { nome: 'Calha central', desc: 'Recebe a água das duas águas no meio do telhado', qty: Math.ceil(GL / 3), un: 'peças de 3 m', unit: 129, alert: 'Sem a calha, a chuva não tem por onde sair.' };
    else if (hs === '1') top = { nome: 'Rufo de topo', desc: 'Fecha o lado mais alto do telhado', qty: Math.ceil(GL), un: 'peças', unit: 89, alert: 'Sem ele, a chuva pode entrar pelo lado mais alto. Tem certeza?' };
    else if (hs === 'varanda') top = { nome: 'Cumeeira e espigões', desc: 'Fecham o topo e as quinas do telhado', qty: Math.ceil(Math.max(0, coreL - coreW) + 4 * (coreW / 2) * 1.5), un: 'peças', unit: 89, alert: 'Sem elas, a chuva pode entrar pelo topo e pelas quinas.' };
    else top = { nome: 'Cumeeira', desc: 'Fecha o encontro das duas águas lá no alto', qty: Math.ceil(GL), un: 'peças', unit: 89, alert: 'Sem ela, a chuva pode entrar pelo topo do telhado. Tem certeza?' };
    let rufo;
    if (hs === 'plat') rufo = { nome: 'Rufos de platibanda', desc: 'Vedam o encontro do telhado com a mureta', qty: Math.ceil(2 * (GW + GL) / 3), un: 'peças de 3 m', unit: 64, alert: 'Sem rufos, a água pode infiltrar na mureta.' };
    else if (hs === 'varanda') rufo = { nome: 'Rufos de encontro', desc: 'Vedam o encontro da varanda com a parede', qty: Math.ceil(2 * (coreW + coreL) / 3), un: 'peças de 3 m', unit: 64, alert: 'Sem rufos, a água pode escorrer pela parede.' };
    else rufo = { nome: 'Rufos laterais', desc: 'Acabamento das bordas, protege as paredes', qty: Math.ceil((tLen * aguas * 2) / 3), un: 'peças de 3 m', unit: 64, alert: 'Sem rufos, a água pode escorrer pela parede e manchar.' };
    const FIXN = { madeira: 'Parafusos para madeira', metalon: 'Parafusos autobrocantes para metalon', lsf: 'Parafusos autobrocantes para LSF', naosei: 'Parafusos (modelo a confirmar)' };
    const FIXD = { madeira: 'Rosca para madeira, com arruela de vedação', metalon: 'Furam o aço sozinhos, com arruela de vedação', lsf: 'Próprios para perfis de aço leve', naosei: 'Um especialista confirma o modelo com você' };
    const fk = fix || 'naosei';
    const KIT = [
      Object.assign({ id: 'cumeeira' }, top),
      Object.assign({ id: 'rufos' }, rufo),
      { id: 'parafusos', nome: FIXN[fk], desc: FIXD[fk], qty: Math.ceil((areaM2 * 3) / 50) * 50, un: 'unidades', unit: 0.85, alert: 'As telhas precisam de parafusos próprios. Se você já tem, tudo bem!' },
      { id: 'vedacao', nome: 'Fita de vedação', desc: 'Evita goteiras nas emendas', qty: Math.max(1, Math.ceil(tQty / 6)), un: 'rolos', unit: 49, alert: 'Sem vedação, podem aparecer goteiras nas emendas.' }
    ];
    const kitItems = KIT.map((k) => ({
      nome: k.nome, desc: k.desc, alert: k.alert, on: !!kit[k.id],
      cls: kit[k.id] ? 'kitrow on' : 'kitrow off',
      qtyTxt: k.qty + ' ' + k.un,
      price: money(k.qty * k.unit),
      total: kit[k.id] ? k.qty * k.unit : 0,
      showAlert: alertKey === k.id && !kit[k.id],
      toggle: () => { const nk = Object.assign({}, kit); nk[k.id] = !kit[k.id]; set({ kit: nk, alertKey: kit[k.id] ? k.id : null }); }
    }));
    const kitComplete = kitItems.every((k) => k.on);
    const acess = kitItems.reduce((a, k) => a + k.total, 0);
    const precoM2 = telha.base + comfort.extraV;
    const telhasV = areaM2 * precoM2;
    const frete = 290 + dias * 25;
    const total = telhasV + acess + frete;

    // ---------- Casa 3D (isométrica) ----------
    // eixo x = comprimento (sentido da caída da telha), eixo y = largura (sentido da cumeeira); z em metros
    const stageH = step === 3 ? 230 : 200;
    const EX = sv < 0.5 ? 1.7 : 1.0;
    const rz = (dist) => dist * sv * EX;
    const isOpen = btype === 'gourmet';
    let WH = ({ casa: 2.8, gourmet: 2.6, galpao: 5, comercio: 3.5 })[btype];
    if (hs === 'chale') WH = 1.0;
    let zTop;
    if (hs === '1') zTop = WH + rz(GW);
    else if (hs === 'plat') zTop = WH + rz(GW / 2) + 0.5;
    else if (hs === 'varanda') zTop = 2.5 + rz(vdep) + 0.5 + rz(coreW / 2);
    else zTop = WH + rz(GW / 2);
    zTop = Math.max(zTop, 3.4);
    const mg = 2.4, span = GW + GL + 4 * mg;
    const sc = Math.min(11, 330 / (span * 0.866), (stageH - 46) / (span * 0.5 + zTop * 1.45));
    const hk = sc * 1.45;
    const X0 = 179 - (GL - GW) * 0.866 * sc / 2;
    const Y0 = stageH - 20 - mg * sc;
    const P = (x, y, z) => ({ x: X0 + (y - x) * 0.866 * sc, y: Y0 - (x + y) * 0.5 * sc - (z || 0) * hk });
    const Pz = (p, dz) => P(p[0], p[1], p[2] + (dz || 0));
    const poly = (pts) => 'M' + pts.map((p) => f1(p.x) + ' ' + f1(p.y)).join(' L') + ' Z ';
    const line = (a, b) => 'M' + f1(a.x) + ' ' + f1(a.y) + ' L' + f1(b.x) + ' ' + f1(b.y) + ' ';
    const circ = (p, r) => 'M' + f1(p.x - r) + ' ' + f1(p.y) + ' a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0 a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0 ';
    const L3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
    const items = [];
    const add = (d, o) => { if (d) items.push(Object.assign({ d: d, f: 'none', s: 'none', w: 0, o: 1, da: '', c: '' }, o || {})); };
    const K = '#0F1E2E', WALL = '#F7EFE4', WALL2 = '#E7D8C2';
    const acc = step >= 8;
    const fixView = step === 7;
    const roofO = fixView ? 0.25 : 1;
    const FIXC = { madeira: '#8B5A2B', metalon: '#5F6B78', lsf: '#9AA7B4', naosei: '#7B8794' };
    const tkm = tk / hk;
    const faceX = (x, y0, y1, z0, z1) => poly([P(x, y0, z0), P(x, y1, z0), P(x, y1, z1), P(x, y0, z1)]);
    const faceY = (y, x0, x1, z0, z1) => poly([P(x0, y, z0), P(x1, y, z0), P(x1, y, z1), P(x0, y, z1)]);

    // terreno
    const dn = (p) => ({ x: p.x, y: p.y + 10 });
    const g00 = P(-mg, -mg), gw0 = P(GW + mg, -mg), g0l = P(-mg, GL + mg), gwl = P(GW + mg, GL + mg);
    add(poly([g00, gw0, dn(gw0), dn(g00)]), { f: '#4F853A' });
    add(poly([g00, g0l, dn(g0l), dn(g00)]), { f: '#5E9A45' });
    add(poly([g00, gw0, gwl, g0l]), { f: '#8CC56B' });
    let grass = '';
    for (let i = 1; i < 6; i++) { const t = i / 6; grass += line(P(-mg + t * (GW + 2 * mg), -mg), P(-mg + t * (GW + 2 * mg) - 0.8, -mg + 0.5)); }
    add(grass, { s: '#7AB35A', w: 1.2 });
    const tree = (x, y) => { const b = P(x, y, 0), th = 1.1 * hk, r = 0.85 * sc; return { t: 'M' + f1(b.x - 1.8) + ' ' + f1(b.y) + ' h3.6 v' + f1(-th) + ' h-3.6 Z ', c: circ({ x: b.x, y: b.y - th - r * 0.55 }, +f1(r)) + circ({ x: b.x - r * 0.6, y: b.y - th }, +f1(r * 0.72)) + circ({ x: b.x + r * 0.6, y: b.y - th - r * 0.1 }, +f1(r * 0.72)) }; };
    const tb = [tree(GW + 1.5, GL * 0.5), tree(GW * 0.3, GL + 1.4)];
    add(tb.map((t) => t.t).join(''), { f: '#8A5A3C' });
    add(tb.map((t) => t.c).join(''), { f: '#4E8F3A', s: '#3B7129', w: 1 });

    // telhado: plano com bordas E0-E1 (beiral) e T0-T1 (topo)
    const plane = (E0, E1, T0, T1, dark, noBand) => {
      const bil = (u, v) => L3(L3(E0, E1, v), L3(T0, T1, v), u);
      if (!noBand) add(poly([Pz(E0), Pz(E1), Pz(E1, tkm), Pz(E0, tkm)]) + poly([Pz(E0), Pz(T0), Pz(T0, tkm), Pz(E0, tkm)]) + poly([Pz(E1), Pz(T1), Pz(T1, tkm), Pz(E1, tkm)]), { f: '#F2D48A', s: K, w: 1.1, o: roofO, c: 'fade' });
      add(poly([Pz(E0, tkm), Pz(E1, tkm), Pz(T1, tkm), Pz(T0, tkm)]), { f: dark ? roofDark : roofHex, s: K, w: 1.6, o: roofO, c: 'roof' });
      const lenV = Math.hypot(E1[0] - E0[0], E1[1] - E0[1]);
      const n = Math.max(3, Math.round(lenV * telha.ribs));
      let rd = '';
      for (let i = 1; i < n; i++) { const v = i / n; rd += line(Pz(bil(0, v), tkm), Pz(bil(1, v), tkm)); }
      add(rd, { s: '#000000', w: 1, o: 0.22 * roofO, c: 'fade' });
      if (fixView) {
        let pd = '';
        [0.06, 0.37, 0.68, 0.96].forEach((u) => { pd += line(Pz(bil(u, 0), -0.05), Pz(bil(u, 1), -0.05)); });
        add(pd, { s: FIXC[fk], w: fk === 'lsf' ? 3 : 4, da: fk === 'naosei' ? '5 5' : '', c: 'fade' });
      }
      if (acc) {
        let sd = '';
        [0.2, 0.55, 0.9].forEach((u) => { for (let v = 0.12; v < 1; v += 0.2) sd += circ(Pz(bil(u, v), tkm), 1.3); });
        add(sd, { f: K, o: kit.parafusos ? 1 : 0, c: 'fade' });
      }
    };
    const pillars = (list) => {
      let fx = '', fy = '';
      list.forEach((p) => { const a = 0.13, x = p[0], y = p[1], z = p[2]; fx += faceX(x - a, y - a, y + a, 0, z); fy += faceY(y - a, x - a, x + a, 0, z); });
      add(fx, { f: WALL2, s: K, w: 1 });
      add(fy, { f: WALL, s: K, w: 1 });
    };
    const box = (x0, x1, y0, y1, z0, z1, cx, cy, ct) => {
      add(faceX(x0, y0, y1, z0, z1), { f: cx, s: K, w: 1.1 });
      add(faceY(y0, x0, x1, z0, z1), { f: cy, s: K, w: 1.1 });
      add(poly([P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)]), { f: ct, s: K, w: 1.1 });
    };
    const casaOpenings = (xf, ya, yb, yf, xa, xb) => {
      const L = yb - ya, dy = ya + 0.35 * L, wy = ya + 0.74 * L;
      add(faceX(xf, wy - 0.6, wy + 0.6, 1.0, 2.0), { f: '#BFD6EA', s: K, w: 1.4 });
      add(faceY(yf, (xa + xb) / 2 - 0.6, (xa + xb) / 2 + 0.6, 1.0, 2.0), { f: '#BFD6EA', s: K, w: 1.4 });
      add(faceX(xf, dy - 0.45, dy + 0.45, 0, 2.1), { f: '#6E4B35', s: K, w: 1.4 });
    };
    const H = WH;
    let ridge = '', rufD = '', vedD = '', ridgeC = '#2B3440';

    if (hs === 'varanda') {
      const d = vdep, a0 = d, a1 = GW - d, b0 = d, b1 = GL - d, Hv = 2.5, Hi = Hv + rz(d), Hc = Hi + 0.5, hw = (a1 - a0) / 2, rc = rz(hw), xm = (a0 + a1) / 2;
      let r1y = b0 + hw, r2y = b1 - hw;
      if (r1y > r2y) { r1y = (b0 + b1) / 2; r2y = r1y; }
      const R1 = [xm, r1y, Hc + rc], R2 = [xm, r2y, Hc + rc];
      const pts2 = [];
      const along = (n0, n1) => { const n = Math.max(1, Math.round((n1 - n0) / 3)); const r = []; for (let i = 0; i <= n; i++) r.push(n0 + (n1 - n0) * i / n); return r; };
      along(0.15, GL - 0.15).forEach((y) => { pts2.push([0.15, y]); pts2.push([GW - 0.15, y]); });
      along(0.15, GW - 0.15).forEach((x) => { pts2.push([x, 0.15]); pts2.push([x, GL - 0.15]); });
      const seen = {}; const uniq = pts2.filter((p) => { const k = f1(p[0]) + ',' + f1(p[1]); if (seen[k]) return false; seen[k] = 1; return true; });
      const mid = (GW + GL) / 2;
      pillars(uniq.filter((p) => p[0] + p[1] > mid).map((p) => [p[0], p[1], Hv]));
      plane([0, GL, Hv], [GW, GL, Hv], [a0, b1, Hi], [a1, b1, Hi], true);
      plane([GW, 0, Hv], [GW, GL, Hv], [a1, b0, Hi], [a1, b1, Hi], true);
      add(faceX(a0, b0, b1, 0, Hc), { f: WALL2, s: K, w: 1.6 });
      add(faceY(b0, a0, a1, 0, Hc), { f: WALL, s: K, w: 1.6 });
      casaOpenings(a0, b0, b1, b0, a0, a1);
      plane([a0, b1, Hc], [a1, b1, Hc], R2, R2, true);
      plane([a1, b0, Hc], [a1, b1, Hc], R1, R2, true);
      plane([a0, b0, Hc], [a0, b1, Hc], R1, R2, false);
      plane([a0, b0, Hc], [a1, b0, Hc], R1, R1, false);
      pillars(uniq.filter((p) => p[0] + p[1] <= mid).map((p) => [p[0], p[1], Hv]));
      plane([0, 0, Hv], [0, GL, Hv], [a0, b0, Hi], [a0, b1, Hi], false);
      plane([0, 0, Hv], [GW, 0, Hv], [a0, b0, Hi], [a1, b0, Hi], false);
      ridge = line(Pz(R1, tkm), Pz(R2, tkm)) + line(P(a0, b0, Hc + tkm), Pz(R1, tkm)) + line(P(a1, b0, Hc + tkm), Pz(R1, tkm)) + line(P(a0, b1, Hc + tkm), Pz(R2, tkm));
      rufD = line(P(a0, b0, Hi + tkm), P(a1, b0, Hi + tkm)) + line(P(a0, b0, Hi + tkm), P(a0, b1, Hi + tkm));
      vedD = line(P(0, 0, Hv + tkm), P(GW, 0, Hv + tkm)) + line(P(0, 0, Hv + tkm), P(0, GL, Hv + tkm));
    } else if (hs === 'plat') {
      const Hr = H + rz(GW / 2), Hp = Hr + 0.5;
      add(poly([P(GW, 0, Hr), P(GW, GL, Hr), P(GW, GL, Hp), P(GW, 0, Hp)]), { f: '#DCCDB6', s: K, w: 1.3 });
      add(poly([P(0, GL, Hr), P(GW / 2, GL, H), P(GW, GL, Hr), P(GW, GL, Hp), P(0, GL, Hp)]), { f: '#EADFCC', s: K, w: 1.3 });
      plane([GW / 2, 0, H], [GW / 2, GL, H], [GW, 0, Hr], [GW, GL, Hr], false, true);
      plane([GW / 2, 0, H], [GW / 2, GL, H], [0, 0, Hr], [0, GL, Hr], true, true);
      add(faceX(0, 0, GL, 0, Hp), { f: WALL2, s: K, w: 1.6 });
      add(faceY(0, 0, GW, 0, Hp), { f: WALL, s: K, w: 1.6 });
      casaOpenings(0, 0, GL, 0, 0, GW);
      add(line(P(0, 0, Hp), P(0, GL, Hp)) + line(P(0, 0, Hp), P(GW, 0, Hp)) + line(P(GW, 0, Hp), P(GW, GL, Hp)) + line(P(0, GL, Hp), P(GW, GL, Hp)), { s: '#FFFFFF', w: 3 });
      ridge = line(P(GW / 2, 0, H + tkm), P(GW / 2, GL, H + tkm));
      ridgeC = '#3E4C5B';
      rufD = line(P(GW, 0, Hr), P(GW, GL, Hr)) + line(P(0, GL, Hr), P(GW, GL, Hr));
    } else if (hs === '1') {
      const hA = H + rz(GW);
      if (isOpen) {
        pillars([[GW - 0.15, GL - 0.15, H], [GW - 0.15, 0.15, H], [0.15, GL - 0.15, hA]]);
        const cx = GW / 2, cy = GL / 2;
        box(cx - 0.9, cx + 0.9, cy - 2.1, cy + 2.1, 0.25, 0.95, '#1E5FA8', '#2F74C0', '#4A8BD1');
        box(cx - 0.75, cx + 0.75, cy - 1.1, cy + 0.9, 0.95, 1.5, '#1E5FA8', '#2F74C0', '#4A8BD1');
        pillars([[0.15, 0.15, hA]]);
      } else {
        add(faceX(0, 0, GL, 0, hA), { f: WALL2, s: K, w: 1.6 });
        add(poly([P(0, 0, 0), P(GW, 0, 0), P(GW, 0, H), P(0, 0, hA)]), { f: WALL, s: K, w: 1.6 });
      }
      if (btype === 'casa') casaOpenings(0, 0, GL, 0, 0, GW);
      plane([GW, 0, H], [GW, GL, H], [0, 0, hA], [0, GL, hA], false);
      ridge = line(P(0, 0, hA + tkm), P(0, GL, hA + tkm));
      rufD = line(P(0, 0, hA + tkm), P(GW, 0, H + tkm));
      vedD = line(P(GW, 0, H + tkm), P(GW, GL, H + tkm));
    } else {
      const topZ = H + rz(GW / 2);
      if (isOpen) {
        pillars([[GW - 0.15, GL - 0.15, H], [GW - 0.15, 0.15, H], [0.15, GL - 0.15, H]]);
        const cx = GW / 2, cy = GL / 2;
        box(cx - 0.9, cx + 0.9, cy - 2.1, cy + 2.1, 0.25, 0.95, '#1E5FA8', '#2F74C0', '#4A8BD1');
        box(cx - 0.75, cx + 0.75, cy - 1.1, cy + 0.9, 0.95, 1.5, '#1E5FA8', '#2F74C0', '#4A8BD1');
        pillars([[0.15, 0.15, H]]);
      } else {
        add(faceX(0, 0, GL, 0, H), { f: WALL2, s: K, w: 1.6 });
        add(faceY(0, 0, GW, 0, H), { f: WALL, s: K, w: 1.6 });
        add(poly([P(0, 0, H), P(GW, 0, H), P(GW / 2, 0, topZ)]), { f: WALL, s: K, w: 1.6 });
      }
      if (hs === 'chale') {
        add(faceY(0, GW / 2 - 0.45, GW / 2 + 0.45, 0, 2.1), { f: '#6E4B35', s: K, w: 1.4 });
        if (topZ > 3.6) add(faceY(0, GW / 2 - 0.5, GW / 2 + 0.5, 2.6, 3.3), { f: '#BFD6EA', s: K, w: 1.4 });
        add(faceY(0, GW * 0.18, GW * 0.18 + 0.9, 0.3, Math.min(0.9, H - 0.05)), { f: '#BFD6EA', s: K, w: 1.2 });
      } else if (btype === 'casa') casaOpenings(0, 0, GL, 0, 0, GW);
      else if (btype === 'galpao') {
        const x0 = 0.28 * GW, x1 = 0.72 * GW, dh = Math.min(4, WH - 0.6);
        add(faceY(0, x0, x1, 0, dh), { f: '#8E99A4', s: K, w: 1.4 });
        let fd = '';
        for (let h = 0.4; h < dh; h += 0.4) fd += line(P(x0, 0, h), P(x1, 0, h));
        add(faceX(0, 0.08 * GL, 0.92 * GL, WH - 1.4, WH - 0.5), { f: '#BFD6EA', s: K, w: 1.4 });
        for (let y = 0.08 * GL + 2; y < 0.92 * GL; y += 2) fd += line(P(0, y, WH - 1.4), P(0, y, WH - 0.5));
        add(fd, { s: K, w: 1, o: 0.45 });
      } else if (btype === 'comercio') {
        add(faceY(0, 0.12 * GW, 0.88 * GW, 0.1, 2.5), { f: '#BFD6EA', s: K, w: 1.4 });
        add(faceY(0, 0.42 * GW, 0.58 * GW, 0, 2.3), { f: '#1F3347', s: K, w: 1.4 });
        add(line(P(0.27 * GW, 0, 0.1), P(0.27 * GW, 0, 2.5)) + line(P(0.73 * GW, 0, 0.1), P(0.73 * GW, 0, 2.5)), { s: K, w: 1, o: 0.45 });
        add(faceX(0, 0.35 * GL, 0.65 * GL, 1.0, 2.2), { f: '#BFD6EA', s: K, w: 1.4 });
        const aw = poly([P(0.06 * GW, 0, 2.9), P(0.94 * GW, 0, 2.9), P(0.94 * GW, -1.1, 2.3), P(0.06 * GW, -1.1, 2.3)]);
        add(aw, { f: '#FFFFFF' });
        let st = '';
        for (let i = 0; i < 8; i += 2) { const t0 = 0.06 + 0.88 * i / 8, t1 = 0.06 + 0.88 * (i + 1) / 8; st += poly([P(t0 * GW, 0, 2.9), P(t1 * GW, 0, 2.9), P(t1 * GW, -1.1, 2.3), P(t0 * GW, -1.1, 2.3)]); }
        add(st, { f: '#E4572E' });
        add(aw, { s: K, w: 1.4 });
      }
      plane([GW, 0, H], [GW, GL, H], [GW / 2, 0, topZ], [GW / 2, GL, topZ], true);
      plane([0, 0, H], [0, GL, H], [GW / 2, 0, topZ], [GW / 2, GL, topZ], false);
      ridge = line(P(GW / 2, 0, topZ + tkm), P(GW / 2, GL, topZ + tkm));
      rufD = 'M' + f1(P(0, 0, H + tkm).x) + ' ' + f1(P(0, 0, H + tkm).y) + ' L' + f1(P(GW / 2, 0, topZ + tkm).x) + ' ' + f1(P(GW / 2, 0, topZ + tkm).y) + ' L' + f1(P(GW, 0, H + tkm).x) + ' ' + f1(P(GW, 0, H + tkm).y);
      vedD = line(P(0, 0, H + tkm), P(0, GL, H + tkm));
    }
    add(vedD, { s: '#F28C28', w: 3, o: acc && kit.vedacao ? 1 : 0, c: 'fade' });
    add(rufD, { s: '#2B3440', w: 3.5, o: acc && kit.rufos ? 1 : 0, c: 'fade' });
    add(ridge, { s: ridgeC, w: 5.5, o: acc && kit.cumeeira ? 1 : 0, c: 'fade' });
    const tf = [tree(GW + 1.1, -1.3), tree(-1.5, GL + 0.5)];
    add(tf.map((t) => t.t).join(''), { f: '#8A5A3C' });
    add(tf.map((t) => t.c).join(''), { f: '#5A9D44', s: '#3B7129', w: 1 });
    if (step === 3) add(line(P(0, -0.9, 0), P(GW, -0.9, 0)) + line(P(-0.9, 0, 0), P(-0.9, GL, 0)), { s: accent, w: 2.5, da: '4 4' });
    const blank = { d: '', f: 'none', s: 'none', w: 0, o: 0, da: '', c: '' };
    const Hs = {};
    for (let i = 0; i < 72; i++) Hs['p' + i] = items[i] || blank;

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const midW = P(GW / 2, -0.9, 0), midL = P(-0.9, GL / 2, 0);
    const tagW = { cls: focus === 'w' ? 'tag on' : 'tag', left: f1(clamp(midL.x - 30, 190, 358 - 136)), top: f1(clamp(midL.y - 8, 6, stageH - 50)) };
    const tagL = { cls: focus === 'l' ? 'tag on' : 'tag', left: f1(clamp(midW.x - 150, 6, 20)), top: f1(clamp(midW.y - 8, 6, stageH - 50)) };
    const mirrorT = (s.mirror && step !== 3) ? 'translate(358 0) scale(-1 1)' : 'translate(0 0)';

    // ---------- Progresso ----------
    const NAMES = ['Área', 'Medidas', 'Telha', 'Conforto', 'Kit', 'Pronto'];
    const phase = [0, 1, 2, 2, 3, 3, 4, 5, 5, 6][step];
    const segs = NAMES.map((n, i) => ({ cls: (i < phase - 1 || step === 9) ? 'seg done' : (i === phase - 1 ? 'seg cur' : 'seg') }));
    const phaseLabel = step === 0 ? 'Obra · vamos começar' : (step === 9 ? 'Obra concluída' : 'Obra · ' + NAMES[phase - 1]);
    const phaseCount = phase + '/6';

    // ---------- Opções ----------
    const AREAS = [
      { id: 'casa', nome: 'Casa', sub: 'O telhado da sua casa', icon: 'M5 15 L16 6 L27 15 M8 13 V26 H24 V13 M13 26 V19 H19 V26' },
      { id: 'gourmet', nome: 'Área gourmet ou garagem', sub: 'Varanda, churrasqueira, carro', icon: 'M4 12 L16 6 L28 12 M7 11 V27 M25 11 V27 M10 24 V20 L12.5 16.5 H19.5 L22 20 V24 Z M12.5 24 V26 M19.5 24 V26' },
      { id: 'galpao', nome: 'Galpão', sub: 'Depósito, oficina, barracão', icon: 'M4 27 V14 Q16 3 28 14 V27 Z M11 27 V19 H21 V27 M11 22.5 H21' },
      { id: 'comercio', nome: 'Comércio', sub: 'Loja, escritório, salão', icon: 'M5 12 H27 L25 6 H7 Z M5 12 Q8 16 11 12 Q14 16 17 12 Q20 16 23 12 Q26 16 27 12 M7 15 V27 H25 V15 M13 27 V20 H19 V27' }
    ];
    const areas = AREAS.map((a) => ({ ...a, on: area === a.id, cls: area === a.id ? 'opt on' : 'opt', pick: () => set({ area: a.id, w: DIMS[a.id][0], l: DIMS[a.id][1], shape: null }) }));
    const models = TELHAS.map((t) => ({ curto: t.curto, pick: () => set({ telha: t.id, knownTelha: true, area: area || 'casa', step: 2, color: undefined }) }));
    const PRIOS = [
      { id: 'fresca', nome: 'Casa fresquinha', sub: 'Menos calor lá dentro', icon: 'M16 4 V28 M4 16 H28 M7.5 7.5 L24.5 24.5 M24.5 7.5 L7.5 24.5 M12.5 5.5 L16 9 L19.5 5.5 M12.5 26.5 L16 23 L19.5 26.5' },
      { id: 'silencio', nome: 'Silêncio na chuva', sub: 'Sem aquele barulhão', icon: 'M9 18 H23 A5 5 0 0 0 22 8.2 A7 7 0 0 0 9.5 10 A4 4 0 0 0 9 18 Z M11 22 L10 26 M16 22 L15 26 M21 22 L20 26' },
      { id: 'colonial', nome: 'Visual colonial', sub: 'Jeitinho de telha de barro', icon: 'M4 18 Q8 12 12 18 Q16 12 20 18 Q24 12 28 18 M4 25 Q8 19 12 25 Q16 19 20 25 Q24 19 28 25' },
      { id: 'preco', nome: 'Melhor preço', sub: 'O melhor custo-benefício', icon: 'M5 5 H15 L27 17 L17 27 L5 15 Z M10.5 10.5 L10.6 10.6' }
    ];
    const prioOpts = PRIOS.map((p) => ({ ...p, on: has(p.id), cls: has(p.id) ? 'opt on' : 'opt', pick: () => set({ prios: has(p.id) ? prios.filter((x) => x !== p.id) : prios.concat([p.id]) }) }));
    const cards = ordered.map((t, i) => ({
      nome: t.nome, desc: t.desc, profile: t.profile, img: t.img,
      cls: i === 0 ? 'gcard ideal' : 'gcard',
      badge: i === 0 ? 'Sua telha ideal' : 'Alternativa',
      num: (i + 1) + ' de 3',
      delay: (i * 0.12) + 's',
      preco: money(t.base),
      bars: [
        { label: 'Conforto térmico', w: (t.termico * 20) + '%' },
        { label: 'Silêncio', w: (t.silencio * 20) + '%' },
        { label: 'Preço', w: (t.preco * 20) + '%' }
      ]
    }));
    const dots = ordered.map((t, i) => ({
      cls: i === cardIdx ? 'dot on' : 'dot', label: 'Ver ' + t.nome,
      go: () => { set({ cardIdx: i }); if (self.car) self.car.scrollTo({ left: i * 302, behavior: 'smooth' }); }
    }));
    const colors = COLORS.map((c) => ({ ...c, on: c.id === colorId, cls: c.id === colorId ? 'sw on' : 'sw', pick: () => set({ color: c.id }) }));
    const comforts = COMF.map((c) => ({
      nome: c.nome, mm: c.mm, desc: c.desc, rec: !!c.rec, on: c.id === comfortId,
      cls: c.id === comfortId ? 'opt on' : 'opt',
      extra: c.extraV === 0 ? 'Incluso' : '+ ' + money(c.extraV) + '/m²',
      th: f1(38 * c.level), ty: f1(44 - 38 * c.level),
      pick: () => set({ comfort: c.id })
    }));
    const SHAPES = [
      { id: '1', nome: '1 água', sub: 'A chuva cai para um lado só', wall: 'M14 52 V26 L66 34 V52 Z', roof: 'M8 23 L72 33' },
      { id: '2', nome: '2 águas', sub: 'A chuva cai para os dois lados', wall: 'M16 52 V30 L40 15 L64 30 V52 Z', roof: 'M10 33 L40 12 L70 33' },
      { id: 'chale', nome: 'Chalé', sub: 'Bem inclinado, quase até o chão', wall: 'M22 52 V44 L40 17 L58 44 V52 Z M36 52 V43 H44 V52', roof: 'M10 50 L40 8 L70 50' },
      { id: 'plat', nome: 'Platibanda', sub: 'Telhado escondido atrás da mureta', wall: 'M12 52 V20 H68 V52 Z', roof: 'M17 25 L40 31 L63 25' },
      { id: 'varanda', nome: 'Varanda ao redor', sub: 'Telhado de 4 lados com varanda em volta', wall: 'M24 52 V30 H56 V52 Z M11 52 V41 H14 V52 Z M66 52 V41 H69 V52 Z', roof: 'M5 41 L24 33 M75 41 L56 33 M22 30 L40 16 L58 30' },
      { id: 'outro', nome: 'Outro formato', sub: 'Mais lados ou cantos? Um especialista te ajuda.', wall: 'M12 52 V32 H68 V52 Z', roof: 'M7 33 L24 17 H56 L73 33' }
    ];
    const shapeList = SHAPES.filter((x) => isCasa || ['1', '2', 'outro'].indexOf(x.id) >= 0);
    const shapes = shapeList.map((x) => ({ ...x, on: shape === x.id, cls: 'opt shape' + (x.id === 'outro' && shapeList.length % 2 === 1 ? ' wide' : '') + (shape === x.id ? ' on' : ''), pick: () => set({ shape: x.id, especialista: false }) }));
    const slopes = SLOPES.map((x) => ({ nome: x.nome, on: x.id === slopeId, cls: x.id === slopeId ? 'slope on' : 'slope', d: 'M4 26 H40 M4 26 L40 ' + (26 - x.k), pick: () => set({ slope: x.id }) }));
    const FIXO = [
      { id: 'madeira', nome: 'Madeira', sub: 'Vigas e caibros de madeira', fillD: 'M6 12 H42 V36 H6 Z', fillC: '#C08A55', lineD: 'M10 19 Q24 15 38 19 M10 25 Q24 21 38 25 M10 31 Q24 27 38 31', lineC: '#7A4E28' },
      { id: 'metalon', nome: 'Metalon', sub: 'Tubos de aço quadrados ou retangulares', fillD: 'M8 8 H40 V40 H8 Z M14 14 V34 H34 V14 Z', fillC: '#8C98A5', lineD: '', lineC: 'none' },
      { id: 'lsf', nome: 'Light Steel Frame', sub: 'Perfis de aço leve em formato de C', fillD: 'M12 8 H38 V15 H34 V13 H17 V35 H34 V33 H38 V40 H12 Z', fillC: '#C3CCD5', lineD: '', lineC: 'none' },
      { id: 'naosei', nome: 'Ainda não sei', sub: 'Tudo bem, um especialista confirma com você', fillD: 'M24 6 A18 18 0 1 1 23.9 6 Z', fillC: '#FFFFFF', lineD: 'M18 19 A6 6 0 1 1 26.5 24.4 C25 25.2 24 26.4 24 28.5 M24 34.5 V35', lineC: '#34435A' }
    ];
    const fixOpts = FIXO.map((x) => ({ ...x, on: fix === x.id, cls: fix === x.id ? 'opt on' : 'opt', pick: () => set({ fix: x.id }) }));
    const FIXTIP = { madeira: 'Vamos usar parafuso com rosca para madeira e arruela de vedação.', metalon: 'Vamos usar parafuso autobrocante: ele mesmo fura o aço.', lsf: 'Vamos usar parafuso autobrocante próprio para aço fino.', naosei: 'Sem problema. Separamos o kit e um especialista confirma o parafuso com você antes do envio.' };

    const LIM = { w: [3, 30], l: [2, 20] };
    const bump = (dlt) => { const v = focus === 'w' ? w : l; const lim = LIM[focus]; const nv = Math.round(Math.max(lim[0], Math.min(lim[1], v + dlt)) * 10) / 10; set(focus === 'w' ? { w: nv } : { l: nv }); };

    // ---------- Botão principal ----------
    let ctaTxt = 'Continuar', ctaOff = false, onCta = () => go(step + 1);
    if (step === 0) { ctaTxt = 'Começar obra'; ctaOff = !cepOk; }
    else if (step === 1) { ctaOff = !area; }
    else if (step === 2) {
      ctaOff = !shape;
      if (shape === 'outro') { ctaTxt = 'Falar com especialista'; onCta = () => set({ especialista: true }); }
    }
    else if (step === 3) { onCta = () => go(s.knownTelha ? 5 : 4); }
    else if (step === 4) {
      if (!revealed) { ctaTxt = 'Ver minha telha ideal'; ctaOff = prios.length === 0; onCta = () => set({ revealed: true, cardIdx: 0 }); }
      else { ctaTxt = 'Escolher esta telha'; onCta = () => set({ telha: ordered[cardIdx].id, step: 5, color: undefined }); }
    }
    else if (step === 5) { ctaTxt = 'Gostei dessa cor'; }
    else if (step === 7) { ctaTxt = 'Ver acessórios'; ctaOff = !fix; }
    else if (step === 8) { ctaTxt = 'Ver meu telhado pronto'; }
    else if (step === 9) { ctaTxt = s.added ? 'Ir para o carrinho' : 'Colocar tudo no carrinho'; onCta = () => set({ added: true }); }

    const onBack = () => {
      if (step === 4 && revealed) set({ revealed: false });
      else if (step === 5 && s.knownTelha) go(3);
      else if (step > 0) go(step - 1);
    };

    const PALETTE = [accent, '#F29A3F', '#F6C445', '#2E8B57', '#E4572E'];
    const confetti = [];
    for (let i = 0; i < 26; i++) confetti.push({ left: ((i * 37) % 100) + '%', delay: ((i % 9) * 0.11) + 's', color: PALETTE[i % 5], rot: ((i * 47) % 180) + 'deg' });
    const sumOpen = s.sumOpen !== undefined ? s.sumOpen : true;

    return {
      accent, onBack, segs, phaseLabel, phaseCount, stageH,
      notPersp: step !== 3, isPersp: step === 3,
      houseCls: step === 9 ? 'houseB pop' : 'houseB',
      mirrorT, rotate: () => set({ mirror: !s.mirror }),
      H: Hs, items,
      is0: step === 0, is1: step === 1, is2: step === 2, is3: step === 3,
      is4a: step === 4 && !revealed, is4b: step === 4 && revealed,
      is5: step === 5, is6: step === 6, is7: step === 7, is8: step === 8, is9: step === 9,
      cep, onCep, cepOk, fab, dias, roofHex,
      sunOp: step >= 4 && has('fresca') ? 1 : 0, rainOp: step >= 4 && has('silencio') ? 1 : 0,
      tagW, tagL, wTxt: nf(w, 1), lTxt: nf(l, 1),
      focusW: () => set({ focus: 'w' }), focusL: () => set({ focus: 'l' }),
      areas, showModels: !!s.showModels, toggleModels: () => set({ showModels: !s.showModels }), models,
      prioOpts, cards, dots,
      setRef: (el) => { self.car = el; },
      onCarScroll: (e) => { const i = Math.max(0, Math.min(2, Math.round(e.currentTarget.scrollLeft / 302))); if (i !== ((self.state || {}).cardIdx || 0)) set({ cardIdx: i }); },
      colors, comforts, shapes,
      showEsp: shape === 'outro',
      espMsg: s.especialista ? 'Pronto! Um especialista vai te chamar no WhatsApp para montar seu telhado junto com você.' : 'Telhados com mais lados precisam de um olhar de perto. Um especialista monta a lista com você, sem custo.',
      byHouse: !knowSize, bySize: knowSize,
      showSlope: hs !== 'chale', isChale: hs === 'chale',
      focusLabel: focus === 'w' ? 'Largura da obra' : 'Comprimento da obra',
      focusVal: nf(focus === 'w' ? w : l, 1),
      dec: () => bump(-0.5), inc: () => bump(0.5),
      slopes,
      kLenTxt: nf(kLen, 2), kQty,
      decKL: () => set({ kLen: Math.max(1, Math.round((kLen - 0.1) * 10) / 10) }),
      incKL: () => set({ kLen: Math.min(14, Math.round((kLen + 0.1) * 10) / 10) }),
      decKQ: () => set({ kQty: Math.max(1, kQty - 1) }),
      incKQ: () => set({ kQty: kQty + 1 }),
      resultTxt, areaTxt: nf(Math.round(areaM2), 0),
      toggleSize: () => set({ knowSize: !knowSize }),
      sizeLink: knowSize ? 'Prefiro informar as medidas da obra' : 'Já sei o tamanho das telhas',
      fixOpts, hasFix: !!fix, fixTip: FIXTIP[fk],
      kitItems, kitComplete,
      kitOn: kitItems.filter((k) => k.on),
      sumOpen, toggleSum: () => set({ sumOpen: !sumOpen }), chevCls: sumOpen ? 'chev open' : 'chev',
      sumTelha: tQty + ' × ' + telha.nome,
      sumTelhaDet: color.nome + ' · ' + comfort.mm + ' · ' + pieces.map((p) => p.qty + ' de ' + nf(p.len, 2) + ' m').join(' + ') + ' · ' + nf(Math.round(areaM2), 0) + ' m²',
      telhasMoney: money(telhasV), freteMoney: money(frete),
      totalMoney: money(total), parcelaMoney: money(total / 10),
      added: !!s.added,
      confetti,
      ctaTxt, ctaOff, onCta
    };
  }
}

const C = new Component();
C.props = { startStep: 0, accent: '#0A4DA2' };
C.state = {};

let handlers = [];
const on = (fn) => { handlers.push(fn); return handlers.length - 1; };
const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17 L19 7"></path></svg>';
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const each = (arr, fn) => arr.map(fn).join('');
const iff = (c, html) => c ? html : '';

function optCard(it, extraStyle) {
  return `<button class="${it.cls}" style="${extraStyle || ''}" data-c="${on(it.pick)}" aria-pressed="${it.on}"><span class="chk">${CHECK}</span><span class="ico"><svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${it.icon}"></path></svg></span><span class="otitle">${it.nome}</span><span class="odesc">${it.sub}</span></button>`;
}

${iff(v.isPersp, `<button class="${v.tagW.cls}" style="left:${v.tagW.left}px;top:${v.tagW.top}px" data-c="${on(v.focusW)}" aria-label="Ajustar largura">Largura ${v.wTxt} m</button><button class="${v.tagL.cls}" style="left:${v.tagL.left}px;top:${v.tagL.top}px" data-c="${on(v.focusL)}" aria-label="Ajustar comprimento">Comprimento ${v.lTxt} m</button>`)}`;

<h1 class="h1">Monte seu telhado em 2 minutos</h1>

${iff(v.cepOk, `<div class="ok"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21 C12 21 5 14.5 5 9.5 A7 7 0 0 1 19 9.5 C19 14.5 12 21 12 21 Z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg><span>Atendido pela fábrica de ${v.fab} · entrega em ${v.dias} dias úteis</span></div>`)}
</div>`;
  else if (v.is1) body = `<div class="screen" data-k="s1">
<h1 class="h1">O que você vai cobrir?</h1>
<div class="grid2">${each(v.areas, (it) => optCard(it, 'min-height:150px'))}</div>

${iff(v.showModels, `<div style="display:flex;flex-direction:column;gap:8px;animation:rise .3s both"><span class="odesc" style="text-align:center">Escolha o modelo. A gente pula a parte das prioridades.</span><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${each(v.models, (m) => `<button class="chip" data-c="${on(m.pick)}">${m.curto}</button>`)}</div></div>`)}
</div>`;

<h1 class="h1">Qual o formato do telhado?</h1><p class="sub">"Água" é cada lado por onde a chuva escorre.</p>

<svg width="80" height="56" viewBox="0 0 80 56" aria-hidden="true" style="flex-shrink:0"><path d="${it.wall}" fill="#F7EFE4" stroke="#0F1E2E" stroke-width="2" stroke-linejoin="round"></path><path d="${it.roof}" fill="none" stroke="${v.roofHex}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div style="display:flex;flex-direction:column;gap:4px"><span class="otitle">${it.nome}</span><span class="odesc">${it.sub}</span></div></button>`)}</div>
${iff(v.showEsp, `<div class="tip"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M4 5 H20 V16 H9 L4 20 Z"></path></svg><span>${v.espMsg}</span></div>`)}</div>`;

    body = `<div class="screen" data-k="s3" style="gap:16px">
${v.byHouse ? `<div style="display:flex;flex-direction:column;gap:6px"><h1 class="h1">Medidas da obra</h1><p class="sub">Toque numa medida no desenho e ajuste aqui embaixo.</p></div>

  else if (v.is4a) body = `<div class="screen" data-k="s4a">

  else if (v.is4b) body = `<div class="screen" data-k="s4b" style="gap:12px">

<div style="display:flex;flex-direction:column;gap:9px">${each(c.bars, (b) => `<div style="display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;gap:10px;font-size:13px;font-weight:600"><span>${b.label}</span><div class="bar"><i style="width:${b.w}"></i></div></div>`)}</div>
<div style="font-size:13px;opacity:.85;border-top:1px solid rgba(255,255,255,.15);padding-top:10px">A partir de <b>${c.preco}</b> por m²</div></div>`)}</div>
<div style="display:flex;justify-content:center">${each(v.dots, (d) => `<button class="${d.cls}" data-c="${on(d.go)}" aria-label="${d.label}"><i></i></button>`)}</div></div>`;
  else if (v.is5) body = `<div class="screen" data-k="s5">
<h1 class="h1">Escolha a cor</h1><p class="sub">Toque numa cor e veja o telhado mudar lá em cima.</p>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${each(v.colors, (co) => `<button class="${co.cls}" data-c="${on(co.pick)}" aria-pressed="${co.on}"><span class="ring"><span class="fill" style="background:${co.hex}"></span></span><span>${co.nome}</span></button>`)}</div>
<div class="tip"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex-shrink:0"><circle cx="12" cy="12" r="4"></circle><path d="M12 2 v2 M12 20 v2 M2 12 h2 M20 12 h2 M4.9 4.9 l1.4 1.4 M17.7 17.7 l1.4 1.4 M4.9 19.1 l1.4 -1.4 M17.7 6.3 l1.4 -1.4"></path></svg><span>Dica: cores claras refletem mais o sol e ajudam a deixar o ambiente mais fresco.</span></div></div>`;
  else if (v.is6) body = `<div class="screen" data-k="s6">
<h1 class="h1">Qual nível de conforto?</h1><p class="sub">Quanto mais grossa a telha, mais fresco e silencioso fica embaixo dela.</p>
<div style="display:flex;flex-direction:column;gap:12px">${each(v.comforts, (it) => `<button class="${it.cls}" data-c="${on(it.pick)}" aria-pressed="${it.on}" style="flex-direction:row;align-items:center;gap:14px">
<svg width="30" height="60" viewBox="0 0 30 60" aria-hidden="true" style="flex-shrink:0"><rect x="10" y="4" width="10" height="40" rx="5" fill="#EEF3F8" stroke="#34435A" stroke-width="2"></rect><circle cx="15" cy="49" r="8" fill="${v.accent}" stroke="#34435A" stroke-width="2"></circle><rect x="12.5" y="${it.ty}" width="5" height="${it.th}" rx="2.5" fill="${v.accent}"></rect></svg>
<div style="flex-grow:1;display:flex;flex-direction:column;gap:4px">${iff(it.rec, '<span class="seal">Recomendado</span>')}<span class="otitle">${it.nome} · ${it.mm}</span><span class="odesc">${it.desc}</span></div>
<span class="extra">${it.extra}</span></button>`)}</div></div>`;
  else if (v.is7) body = `<div class="screen" data-k="s7">
<h1 class="h1">Onde as telhas vão ser presas?</h1><p class="sub">É a estrutura que fica embaixo do telhado. Veja no desenho lá em cima. Ela define o parafuso certo.</p>
<div class="grid2">${each(v.fixOpts, (it) => `<button class="${it.cls}" style="min-height:168px" data-c="${on(it.pick)}" aria-pressed="${it.on}"><span class="chk">${CHECK}</span>
<span class="ico2"><svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><path d="${it.fillD}" fill="${it.fillC}" fill-rule="evenodd" stroke="#34435A" stroke-width="1.5" stroke-linejoin="round"></path>${it.lineD ? `<path d="${it.lineD}" fill="none" stroke="${it.lineC}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>` : ''}</svg></span>
<span class="otitle">${it.nome}</span><span class="odesc">${it.sub}</span></button>`)}</div>
${iff(v.hasFix, `<div class="tip"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="9"></circle><path d="M12 11 V16 M12 7.5 v.01"></path></svg><span>${v.fixTip}</span></div>`)}</div>`;
  else if (v.is8) body = `<div class="screen" data-k="s8" style="gap:14px">
<h1 class="h1">Seu kit de acessórios</h1><p class="sub">Já separamos o que seu telhado precisa, nas quantidades certas.</p>
${iff(v.kitComplete, `<div class="complete"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 L19.5 5.5 L24.5 5 L25.5 10 L30 12.5 L28 17 L30 21.5 L25.5 23.5 L24.5 28.5 L19.5 28 L16 31 L12.5 28 L7.5 28.5 L6.5 23.5 L2 21.5 L4 17 L2 12.5 L6.5 10 L7.5 5 L12.5 5.5 Z" fill="#2E8B57"></path><path d="M10.5 16.5 L14.5 20.5 L22 12.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Kit completo! Nada vai faltar na hora da obra.</span></div>`)}
<div style="display:flex;flex-direction:column;gap:10px">${each(v.kitItems, (k, i) => `<div style="display:flex;flex-direction:column;gap:8px" data-k="kit${i}">
<label class="${k.cls}"><input type="checkbox" class="sr" ${k.on ? 'checked' : ''} data-ch="${on(k.toggle)}"><span class="box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17 L19 7"></path></svg></span>
<span style="flex-grow:1;display:flex;flex-direction:column;gap:3px"><span class="otitle">${k.nome}</span><span class="odesc">${k.desc}</span><span style="font-size:13px;font-weight:700;color:#34435A">${k.qtyTxt}</span></span><span class="extra" style="font-size:14px">${k.price}</span></label>
${iff(k.showAlert, `<div class="warn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5 V13 M12 16.5 v.01"></path></svg><span>${k.alert}</span></div>`)}</div>`)}</div></div>`;
  else if (v.is9) body = `<div class="screen" data-k="s9" style="gap:14px">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center"><span class="seal" style="align-self:center;background:#E3F3EA;color:#155C39">Obra concluída</span><h1 class="h1">Seu telhado está 100%</h1><p class="sub">Tudo compatível entre si e pronto para entrega.</p></div>
<div class="sum"><button class="sumhead" data-c="${on(v.toggleSum)}" aria-expanded="${v.sumOpen}"><span>Resumo do pedido</span><svg class="${v.chevCls}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9 L12 15 L18 9"></path></svg></button>
${iff(v.sumOpen, `<div style="padding:0 16px 14px;display:flex;flex-direction:column;gap:12px;animation:rise .25s both">
<div style="display:flex;flex-direction:column;gap:4px"><div class="line"><b>${v.sumTelha}</b><b>${v.telhasMoney}</b></div><span class="muted" style="font-size:13px">${v.sumTelhaDet}</span></div>
<div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid #E4E9EE;padding-top:12px">${each(v.kitOn, (k) => `<div class="line"><span>${k.nome} <span class="muted">· ${k.qtyTxt}</span></span><span>${k.price}</span></div>`)}</div>
<div class="line" style="border-top:1px solid #E4E9EE;padding-top:12px"><span>Frete · fábrica de ${v.fab}, ${v.dias} dias úteis</span><span>${v.freteMoney}</span></div></div>`)}
<div style="display:flex;justify-content:space-between;align-items:flex-end;padding:14px 16px;background:#F1F5F9"><span style="font-weight:700">Total</span><div style="display:flex;flex-direction:column;align-items:flex-end"><span class="big" style="font-size:26px">${v.totalMoney}</span><span class="muted" style="font-size:13px">ou 10x de ${v.parcelaMoney} sem juros</span></div></div></div>
${iff(v.added, `<div class="toast"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17 L19 7"></path></svg><span>Tudo no carrinho!</span></div>`)}
<div style="display:flex;gap:10px"><button class="sec"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 L5.3 16.2 A8 8 0 1 1 8 18.8 Z"></path></svg>Receber no WhatsApp</button><button class="sec"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21 C4 16.5 7.5 14 12 14 C16.5 14 20 16.5 20 21"></path></svg>Falar com especialista</button></div>
<button class="link" data-c="${on(restart)}">Recomeçar a simulação</button></div>`;

  return `<div class="app" style="--p:${v.accent}">
<div style="display:flex;align-items:center;gap:12px;padding:12px 16px 8px">
<button class="iconbtn" aria-label="Voltar" data-c="${on(v.onBack)}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"></path></svg></button>
<div style="flex-grow:1;display:flex;flex-direction:column;gap:7px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#34435A"><span>${v.phaseLabel}</span><span>${v.phaseCount}</span></div><div style="display:flex;gap:4px">${each(v.segs, (sg) => `<div class="${sg.cls}"></div>`)}</div></div></div>
<div class="scroll" data-k="scroll"><div class="stage" style="height:${H}px"><div class="stage-in">${house}</div>
${iff(v.notPersp, `<button class="iconbtn" style="position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.9)" data-c="${on(v.rotate)}" aria-label="Girar a casa"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12 A8 8 0 1 1 17.7 6.3"></path><path d="M20 4 V9 H15"></path></svg></button>`)}</div>
${body}</div>
<div class="ctabar"><button class="cta" ${v.ctaOff ? 'disabled' : ''} data-c="${on(v.onCta)}">${v.ctaTxt}</button></div>
${iff(v.is9, `<div style="position:absolute;inset:0;pointer-events:none;overflow:hidden" data-k="conf">${each(v.confetti, (cf) => `<span class="conf" style="left:${cf.left};animation-delay:${cf.delay};background:${cf.color};transform:rotate(${cf.rot})"></span>`)}</div>`)}
</div>`;
}

function restart() { C.state = { step: 0 }; scheduleRender(); }

function morph(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName ||
      (a.nodeType === 1 && a.getAttribute('data-k') !== b.getAttribute('data-k'))) {
    a.replaceWith(b.cloneNode(true)); return;
  }
  if (a.nodeType !== 1) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  for (const at of Array.from(a.attributes)) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for (const at of Array.from(b.attributes)) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  if (a.tagName === 'INPUT') {
    if (a.type === 'checkbox') a.checked = b.hasAttribute('checked');
    else { const nv = b.getAttribute('value') || ''; if (a.value !== nv) a.value = nv; }
  }
  if (a.tagName === 'BUTTON') a.disabled = b.hasAttribute('disabled');
  const ac = Array.from(a.childNodes), bc = Array.from(b.childNodes);
  for (let i = 0; i < bc.length; i++) { if (i < ac.length) morph(ac[i], bc[i]); else a.appendChild(bc[i].cloneNode(true)); }
  for (let i = bc.length; i < ac.length; i++) ac[i].remove();
}

const root = document.getElementById('app');
let lastStep = null, queued = false;
function scheduleRender() { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; render(); }); } }
function render() {
  const v = C.renderVals();
  const html = view(v, C.state);
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  const next = t.content.firstElementChild;
  if (!root.firstElementChild) root.appendChild(next);
  else morph(root.firstElementChild, next);
  const step = C.state.step || 0;
  if (step !== lastStep) { const sc = root.querySelector('.scroll'); if (sc) sc.scrollTop = 0; lastStep = step; }
  fitStage();
}
function fitStage() {
  const st = root.querySelector('.stage'), inner = root.querySelector('.stage-in');
  if (!st || !inner) return;
  const k = Math.min(1, st.clientWidth / 358);
  inner.style.transform = 'translateX(-50%) scale(' + k.toFixed(3) + ')';
}
window.addEventListener('resize', fitStage);

root.addEventListener('click', (e) => {
  const el = e.target.closest('[data-c]');
  if (!el || el.disabled) return;
  const fn = handlers[+el.getAttribute('data-c')];
  if (!fn) return;
  const isDot = el.classList.contains('dot');
  fn(e);
  if (isDot) {
    const car = root.querySelector('.carousel'), idx = Array.from(el.parentNode.children).indexOf(el);
    if (car) car.scrollTo({ left: idx * 302, behavior: 'smooth' });
  }
});
root.addEventListener('error', (e) => { if (e.target && e.target.tagName === 'IMG') e.target.style.display = 'none'; }, true);
root.addEventListener('input', (e) => {
  const el = e.target.closest('[data-in]');
  if (el) handlers[+el.getAttribute('data-in')]({ target: el });
});
root.addEventListener('change', (e) => {
  const el = e.target.closest('[data-ch]');
  if (el) handlers[+el.getAttribute('data-ch')]({ target: el });
});
root.addEventListener('scroll', (e) => {
  const el = e.target;
  if (el && el.classList && el.classList.contains('carousel')) {
    const i = Math.max(0, Math.min(2, Math.round(el.scrollLeft / 302)));
    if (i !== (C.state.cardIdx || 0)) C.setState({ cardIdx: i });
  }
}, true);

render();
</script>
