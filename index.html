    A.fans.forEach((f) => { f.rotation.y += dt * 5.5; });
    A.smoke.forEach((p) => {
      p.age += dt; if (p.age > p.life) p.age -= p.life;
      const k = p.age / p.life, s = 0.3 + 1.15 * k;
      p.sp.position.set(p.x + p.dx * k, p.y + 1.5 * k, p.z + p.dz * k); p.sp.scale.set(s, s, 1);
      p.sp.material.opacity = 0.5 * Math.sin(Math.PI * Math.min(1, k * 1.1));
    });
    if (A.bulbs) {
      const im = A.bulbs, n = im.count, c = A.cTmp || (A.cTmp = new T.Color()), gk = A.glowK || 1;
      for (let q = 0; q < n; q++) { const v = (0.58 + 0.42 * Math.max(0, Math.sin(t * 2.4 - q * 0.5))) * gk; c.setRGB(1.0 * v, 0.8 * v, 0.46 * v); im.setColorAt(q, c); }
      im.instanceColor.needsUpdate = true;
    }
    if (A.ember) E.mat.ember.emissiveIntensity = 1.05 + 0.45 * Math.sin(t * 7.3) * Math.sin(t * 2.9 + 1.3);
    A.neons.forEach((nn) => { const ph = (t + nn.ph) % 2.6, on = ph < 2.0 && !(ph > 1.3 && ph < 1.42); nn.mat.color.setScalar(on ? 1 : 0.22); });
    if (A.water) E.tex.caustic.offset.set((t * 0.025) % 1, (t * 0.04) % 1);
    A.floats.forEach((f) => { const a = t * 0.22 + f.ph; f.m.position.set(f.cx + Math.cos(a) * f.rx, f.y0 + 0.022 * Math.sin(t * 1.7 + f.ph), f.cz + Math.sin(a) * f.rz); f.m.rotation.y = 0.07 * Math.sin(t * 1.3); });
    A.cars.forEach((c) => { const p = c.g.position; p.x += c.v * dt; if (c.v > 0 && p.x > c.xb) p.x = c.xa; if (c.v < 0 && p.x < c.xa) p.x = c.xb; });
    A.peds.forEach((p) => {
      p.u += p.v * dt; if (p.u > p.xb) { p.u = p.xb; p.v = -Math.abs(p.v); } if (p.u < p.xa) { p.u = p.xa; p.v = Math.abs(p.v); }
      const sw = Math.sin(t * 7.2 + p.ph);
      p.g.position.x = p.u; p.g.position.y = 0.12 + 0.025 * Math.abs(sw); p.g.rotation.y = p.v > 0 ? Math.PI / 2 : -Math.PI / 2;
      p.legs[0].rotation.x = 0.45 * sw; p.legs[1].rotation.x = -0.45 * sw; p.arms[0].rotation.x = -0.35 * sw; p.arms[1].rotation.x = 0.35 * sw;
    });
  }

  _buildLot(blocks, Hg) {
    const E = this._E, T = E.T, M = E.mat, bb = E.bb;

    const lx0 = bb.x0 - 1.6, lx1 = bb.x1 + 1.6, lz0 = bb.z0 - 3, lz1 = bb.z1 + (E.galpao ? 11 : E.area === 'comercio' ? 7.2 : E.area === 'gourmet' && !poolB ? 7.4 : 4.5);

    this._box(L, cx - 160, 0, lz1 + 11, cx + 160, 0.12, lz1 + 13.4, M.sidewalk, null, true);

    this._box(L, lx1, 0, lz0, lx1 + mt, mh, lz1, M.muro);
    this._box(L, lx0 - mt, 0, lz0 - mt, lx1 + mt, mh, lz0, M.muro);
    [[lx0 - mt - 0.02, lz0 - mt - 0.02, lx0 + 0.02, lz1], [lx1 - 0.02, lz0 - mt - 0.02, lx1 + mt + 0.02, lz1], [lx0 - mt - 0.02, lz0 - mt - 0.02, lx1 + mt + 0.02, lz0 + 0.02]].forEach((q) => this._box(L, q[0], mh, q[1], q[2], mh + 0.04, q[3], M.coping, null, true));

    else if (E.galpao) {

      for (let xq = lx0 + 0.8; xq < lx0 + 0.8 + 2.5 * 4; xq += 2.5) this._box(L, xq, 0.03, lz1 - 5.2, xq + 0.1, 0.036, lz1 - 0.4, M.lane, null, true);
      const gt = (E.gates || [])[0];
      if (gt) this._truck(L, gt.x, gt.z + 1.0);
      this._tree(L, lx0 - 1.6, lz0 - 2.2, 1.25, 3);
      this._tree(L, lx1 + 1.4, lz0 - 1.0, 1.05, 7);
      E.frontTrees.push(this._tree(L, lx1 - 1.0, lz1 + 1.3, 0.85, 9));
    } else {
      // entrada de carro e caminho
      blocks.forEach((b) => { if (b.t === 'garagem') { this._box(L, b.x + 0.2, 0, b.y + b.d, b.x + b.w - 0.2, 0.03, lz1 + 0.01, M.paver, null, true); } });
      if (E.doorAt) this._box(L, E.doorAt.x - 0.6, 0, E.doorAt.z, E.doorAt.x + 0.6, 0.03, lz1 + 0.01, M.paver, null, true);
      // árvores
      this._tree(L, lx0 - 1.6, lz0 - 2.2, 1.25, 3);
      this._tree(L, lx1 + 1.4, lz0 - 1.0, 1.05, 7);
      const busy = [];
      blocks.forEach((b) => { if (b.t === 'garagem') busy.push([b.x - 0.3, b.x + b.w + 0.3]); });
      if (E.doorAt) busy.push([E.doorAt.x - 1.2, E.doorAt.x + 1.2]);

  // =====================================================================

      P.faces.push(Object.assign({ id: 'E', phi: -Math.PI / 2, sx: cx0 + r, sz: cz0, y: yC, acr: cS, run: r, ov: 0.3 }, h));

  bomPitched(m) {

  _buildFace(G, fc, P, m, thk) {

      this._box(rf, fc.acr, yb - 0.16, 0, fc.acr + tk, rh + tk, rl, M.rufo);
      this._box(rf, fc.acr - 0.12, rh, 0, fc.acr, rh + tk, rl, M.rufo);

      sh.closePath();
      const tx = E.tex.chev.clone(); tx.needsUpdate = true; tx.wrapS = tx.wrapT = T.RepeatWrapping; tx.repeat.set(1 / 1.4, 1 / 1.3);
      const fm = new T.MeshBasicMaterial({ map: tx, transparent: true, opacity: 0.45, depthWrite: false });
      const fl = new T.Mesh(new T.ShapeGeometry(sh), fm);

    body = `<div style="display:flex;flex-direction:column;gap:16px" data-k="ps">

// ---------- abrir, fechar e usar o telhado montado ----------
function openStudio(forma) {
  const cs = C.state || {};
  if (STU && studioMounted) { STU.componentWillUnmount(); studioMounted = false; }
  STU = new Studio();
  // cada tipo de obra tem o seu 3D: casa, área gourmet, galpão ou comércio
  STU.props = { accent: (C.props && C.props.accent) || '#0A4DA2', startForma: forma, startMode: 'montar', startTpl: 'auto', area: cs.area || 'casa' };
  const pitched = ['1', '2', 'chale', 'varanda'].indexOf(forma) >= 0;
  const mem = (cs.studioMem || {})[studioMemKey(cs, forma)];
  const st = mem ? Object.assign({}, mem) : {};
  // medidas vindas do fluxo: outras áreas (galpão, comércio...) ou medidas mudadas depois de usar o Estúdio
  const btype = cs.area || 'casa';
  const fromFlow = mem ? (cs.w !== mem.__w || cs.l !== mem.__l) : btype !== 'casa';
  if (pitched && fromFlow && cs.w !== undefined && cs.l !== undefined) { st.cL = cs.w; st.cS = cs.l; }
  if (pitched && !mem && cs.slope && forma !== 'chale') st.slope = cs.slope;
  if (forma === 'chale' && cs.hC !== undefined) st.hC = cs.hC;
  // voltando das etapas seguintes: a cor escolhida depois continua no 3D
  if (mem && cs.color && (cs.step || 0) >= 4) st.color = cs.color;
  STU.state = st;
  C.setState({ shape: forma, especialista: false, studio: forma });
}

function closeStudio() {
  if (STU && studioMounted) { STU.componentWillUnmount(); studioMounted = false; }
  C.setState({ studio: null });
}

function applyStudio() {
  if (!STU) return;
  const m = STU.mdl(), ss = STU.state || {}, cs = C.state || {};
  const r1 = (x) => Math.round(x * 10) / 10;
  const p = { studio: null, shape: m.forma, area: cs.area || 'casa', wRaw: undefined, lRaw: undefined, focus: 'w', knowSize: false, revealed: false, cardIdx: 0, color: m.color };
  let lens;
  if (!m.blocksMode) {
    // largura = sentido da cumeeira, comprimento = sentido em que a água escorre (como na etapa Medidas)
    p.w = r1(m.casa.L); p.l = r1(m.casa.S);
    if (m.forma !== 'chale') p.slope = m.slope;
    else { p.hC = m.hC; p.hCRaw = undefined; }
    p.telha = m.telha;
    if (ss.telha) p.knownTelha = true;
    lens = STU.bomPitched(m).lens;
  } else {
    let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
    m.blocks.forEach((b) => { if (!STU.isRoof(b)) return; x0 = Math.min(x0, b.x); x1 = Math.max(x1, b.x + b.w); z0 = Math.min(z0, b.y); z1 = Math.max(z1, b.y + b.d); });
    p.w = r1(x1 - x0); p.l = r1(z1 - z0);
    lens = STU.bomCalc(m.blocks).lens;
  }
  p.w = Math.max(3, Math.min(30, p.w)); p.l = Math.max(2, Math.min(20, p.l));
  // a lista de telhas do Estúdio vale enquanto formato e medidas não mudarem na etapa Medidas
  p.studioPieces = Object.keys(lens).map(Number).sort((a, b) => b - a).map((len) => ({ qty: lens[len], len }));
  p.studioKey = JSON.stringify([p.shape, p.w, p.l, p.slope || cs.slope || 'medio'].concat(m.forma === 'chale' ? [p.hC] : []));
  const keep = Object.assign({}, ss);
  ['camReq', 'cam', 'pick', 'inside', 'mode', 'glReady', 'glFail', 'xray', 'comum'].forEach((k) => { delete keep[k]; });
  keep.__w = p.w; keep.__l = p.l;
  p.studioMem = Object.assign({}, cs.studioMem || {}, { [studioMemKey(cs, m.forma)]: keep });
  p.step = (p.knownTelha || cs.knownTelha) ? 5 : 4;
  if (studioMounted) { STU.componentWillUnmount(); studioMounted = false; }
  C.setState(p);
}

// liga o 3D depois que a tela do Estúdio entra na página
function studioAfterRender() {
  if (!STU) return;
  const cv = root.querySelector('canvas[data-keep]');
  esBindGrab();
  if (!studioMounted) {
    studioMounted = true;
    STU._cv = cv || null;
    STU.componentDidMount();
    const row = root.querySelector('.es-hscroll[data-k="frow"]');
    if (row && STU._refFR) STU._refFR(row);
    const pn = root.querySelector('.es-panel'); if (pn) pn.scrollTop = 0;
  } else if (cv && cv !== STU._cv) {
    STU.componentWillUnmount(); STU._E = null; STU._failed = false; STU._waitN = 0;
    STU._cv = cv; STU.componentDidMount();
  } else STU.componentDidUpdate();
}

// baixa o three.js com antecedência, enquanto a pessoa responde as primeiras perguntas
function preloadThree() { if (!window.THREE && !window.__threeLoading) Studio.prototype._loadThree.call(null); }

// =====================================================================
//  VITRINE 3D: a casa (ou o galpão) montada no Estúdio aparece nas etapas
//  seguintes no lugar do desenho: muda de cor, mostra a telha por dentro,
//  a estrutura e o kit. Se o 3D não abrir, o desenho continua lá.
// =====================================================================
let VW = null, vwMounted = false, vwArea = null, vwShot = null;
const VW_H = 236;
const ICO_ROT = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12 A8 8 0 1 1 17.7 6.3"></path><path d="M20 4 V9 H15"></path></svg>';
const ICO_ARR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8 L3 12 L7 16 M17 8 L21 12 L17 16 M3 12 H21"></path></svg>';
const ICO_CAM = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8 H7.5 L9 5.5 H15 L16.5 8 H20 V19 H4 Z"></path><circle cx="12" cy="13" r="3.4"></circle></svg>';

function stage3d(v, house) {
  const p = v.v3d, st = VW && vwArea === p.area ? (VW.state || {}) : {};
  const ready = vwMounted && !!st.glReady && !st.glFail;
  vwShot = p.shot;
  const rot = ready ? () => { if (VW) VW.turn(Math.PI / 2); } : v.rotate;
  return `<div class="stage s3d${ready ? ' on' : ''}" style="height:${VW_H}px" data-k="stage3d"><div class="stage-in">${house}</div>`
    + `<canvas class="cv3d" data-keep="1" aria-label="Sua casa em 3D. Arraste para os lados para girar."></canvas>`
    + iff(ready && !st.touched && p.state.vstep !== 'calor', `<div class="hint3d" data-k="h3d">${ICO_ARR}Arraste para girar</div>`)
    + iff(ready && p.state.vstep === 'calor', `<div class="leg3d" data-k="leg"><i></i>Calor do sol</div>`)
    + `<button class="iconbtn" style="position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.9)" data-c="${on(rot)}" aria-label="Girar a casa">${ICO_ROT}</button>`
    + iff(ready && v.is9, `<button class="shot3d" data-k="shot" data-c="${on(shareShot)}" aria-label="Salvar ou compartilhar a foto do seu telhado">${ICO_CAM}<span>Salvar foto</span></button>`)
    + `</div>`
    // card "Na sua obra": a comparação fica embaixo da imagem, em botões grandes; "Com telha comum" pulsa até o primeiro toque
    + iff(ready && p.state.vstep === 'calor', cmpBar(!!p.state.comum, !!(C.state || {}).pirCmpSeen));
}

function cmpBar(comum, seen) {
  const b = (hot, txt, ico) => {
    const onB = comum === hot;
    return `<button class="cmpb ${hot ? 'hot' : 'pir'}${onB ? ' on' : ''}${hot && !seen ? ' pulse' : ''}" data-c="${on(() => C.setState(hot ? { pirComum: true, pirCmpSeen: true } : { pirComum: false }))}" aria-pressed="${onB}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${ico}"></path></svg><span>${txt}</span></button>`;
  };
  const cap = (!seen ? 'Toque em “Com telha comum” e compare o calor entrando.' : comum ? 'Com telha comum, muito mais calor do sol passa para dentro.' : 'Com a Isotelha PIR, a maior parte do calor do sol fica do lado de fora.');
  return `<div class="cmpbar" data-k="cmpbar"><div class="cmpseg" role="group" aria-label="Compare o calor entrando">${b(false, 'Com Isotelha PIR', 'M12 3 V21 M4.2 7.5 L19.8 16.5 M4.2 16.5 L19.8 7.5 M9.5 4.5 L12 7 L14.5 4.5 M9.5 19.5 L12 17 L14.5 19.5')}${b(true, 'Com telha comum', 'M16 12 A4 4 0 1 1 8 12 A4 4 0 1 1 16 12 Z M12 2.5 V4.5 M12 19.5 V21.5 M2.5 12 H4.5 M19.5 12 H21.5 M5.3 5.3 L6.7 6.7 M17.3 17.3 L18.7 18.7 M5.3 18.7 L6.7 17.3 M17.3 6.7 L18.7 5.3')}</div><p class="cmpcap">${cap}</p></div>`;
}

function vwUnmount() {
  if (VW && vwMounted) VW.componentWillUnmount();
  vwMounted = false;
  if (VW) { VW._cv = null; VW.state = Object.assign({}, VW.state, { glReady: false }); }
}

// liga, atualiza ou desliga o 3D depois de cada desenho da tela
function viewerAfterRender(v) {
  const p = v && v.v3d;
  let cv = p ? root.querySelector('canvas.cv3d') : null;
  if (!p || !cv) { vwUnmount(); return; }
  if (!VW || vwArea !== p.area) {
    vwUnmount();
    VW = new Studio(); vwArea = p.area;
    VW.props = { viewer: true, area: p.area, accent: (C.props && C.props.accent) || '#0A4DA2', startMode: 'montar', startTpl: 'auto' };
    VW.state = {};
  }
  const keep = VW.state || {};
  VW.state = Object.assign({ glReady: keep.glReady, glFail: keep.glFail, touched: keep.touched }, p.state);
  if (!vwMounted || cv !== VW._cv) {
    if (vwMounted) VW.componentWillUnmount();
    // um canvas que já teve um 3D desligado não abre outro: troca por um canvas novo
    if (cv.__glUsed) { const nc = cv.cloneNode(false); cv.replaceWith(nc); cv = nc; }
    cv.__glUsed = true;
    vwMounted = true; VW._E = null; VW._failed = false; VW._waitN = 0; VW._cv = cv; VW.state.glReady = false;
    VW.componentDidMount();
  } else VW.componentDidUpdate();
}

// foto da casa pronta: compartilha (WhatsApp e outros apps) no celular ou baixa no computador
function shareShot() { if (VW && VW._E) VW.shareShot(vwShot || []); }

const root = document.getElementById('app');
let lastStep = null, queued = false;
function scheduleRender() { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; render(); }); } }
function render() {
  const inStudio = !!(C.state.studio && STU);
  let html, v = null;
  if (inStudio) html = studioView(STU.renderVals());
  else { v = C.renderVals(); html = view(v, C.state); }
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  const next = t.content.firstElementChild;
  if (!root.firstElementChild) root.appendChild(next);
  else morph(root.firstElementChild, next);
  const st = C.state;
  const step = (st.step || 0) + '|' + (st.pirMode || '') + '|' + (st.pirIdx || 0) + '|' + (st.pirAns ? 1 : 0);
  if (step !== lastStep) { const sc = root.querySelector('.scroll'); if (sc) sc.scrollTop = 0; lastStep = step; }
  viewerAfterRender(v);
  if (inStudio) studioAfterRender();
  else if (studioMounted) { STU.componentWillUnmount(); studioMounted = false; }
  fitStage();
}
function fitStage() {
  const st = root.querySelector('.stage'), inner = root.querySelector('.stage-in');
  if (!st || !inner) return;
  const k = Math.min(1, st.clientWidth / 358);
  inner.style.transform = 'translateX(-50%) scale(' + k.toFixed(3) + ')';
}
window.addEventListener('resize', fitStage);

root.addEventListener('click', (e) => {
  const el = e.target.closest('[data-c]');
  if (!el || el.disabled) return;
  const fn = handlers[+el.getAttribute('data-c')];
  if (!fn) return;
  const isDot = el.classList.contains('dot');
  fn(e);
  if (isDot) {
    const car = root.querySelector('.carousel'), idx = Array.from(el.parentNode.children).indexOf(el);
    if (car) car.scrollTo({ left: idx * 302, behavior: 'smooth' });
  }
});
root.addEventListener('error', (e) => { if (e.target && e.target.tagName === 'IMG') e.target.style.display = 'none'; }, true);
root.addEventListener('input', (e) => {
  const el = e.target.closest('[data-in]');
  if (el) handlers[+el.getAttribute('data-in')]({ target: el });
});
root.addEventListener('change', (e) => {
  const el = e.target.closest('[data-ch]');
  if (el) handlers[+el.getAttribute('data-ch')]({ target: el });
});
root.addEventListener('scroll', (e) => {
  const el = e.target;
  if (el && el.classList && el.classList.contains('carousel')) {
    const i = Math.max(0, Math.min(el.children.length - 1, Math.round(el.scrollLeft / 302)));
    if (i !== (C.state.cardIdx || 0)) C.setState({ cardIdx: i });
  }
}, true);

render();
setTimeout(preloadThree, 1200);
</script>
